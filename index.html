<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPOS Shell v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f1f5f9; overflow: hidden; }
        .sidebar-item { transition: 0.2s; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; color: #94a3b8; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar-item.active { background: #6366f1; color: white; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col gap-2">
        <div class="text-2xl font-black italic text-indigo-500 mb-8 px-2">Pro<span class="text-white">POS</span></div>
        
        <nav class="flex flex-col gap-1">
            <div onclick="gantiMenu('dashboard')" id="m-dashboard" class="sidebar-item active"><i data-lucide="layout-dashboard"></i> Dashboard</div>
            <div onclick="gantiMenu('referensi')" id="m-referensi" class="sidebar-item"><i data-lucide="package"></i> Referensi Produk</div>
            <div onclick="gantiMenu('stok')" id="m-stok" class="sidebar-item"><i data-lucide="boxes"></i> Kelola Stok</div>
            <div onclick="gantiMenu('transaksi')" id="m-transaksi" class="sidebar-item"><i data-lucide="shopping-cart"></i> Transaksi</div>
            <div onclick="gantiMenu('report')" id="m-report" class="sidebar-item"><i data-lucide="file-text"></i> Report</div>
            <div onclick="gantiMenu('setting')" id="m-setting" class="sidebar-item"><i data-lucide="settings"></i> Setting</div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-900/50">
            <h2 id="judul-halaman" class="font-bold uppercase tracking-widest text-sm text-slate-400">Dashboard</h2>
            <div id="jam" class="text-xs font-mono text-slate-500"></div>
        </header>

        <div id="konten-utama" class="flex-1 overflow-y-auto p-6">
            </div>
    </main>

    <script>
        // Inisialisasi Database Kosong
        let db_sales = JSON.parse(localStorage.getItem('db_sales')) || [];
        let db_produk = JSON.parse(localStorage.getItem('db_produk')) || [];

        // Fungsi Ganti Menu
        function gantiMenu(menu) {
            // Update UI Sidebar
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById('m-' + menu).classList.add('active');
            document.getElementById('judul-halaman').innerText = menu;

            const target = document.getElementById('konten-utama');

            // Logika Tampilan per Menu
            if(menu === 'dashboard') {
                renderHalamanDashboard(target);
            } else {
                target.innerHTML = `<div class="flex items-center justify-center h-full opacity-20 text-2xl font-bold italic uppercase">Menu ${menu} Belum Diisi</div>`;
            }
            lucide.createIcons();
        }

        // --- KHUSUS HALAMAN DASHBOARD ---
        function renderHalamanDashboard(div) {
            div.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-slate-800/50 p-6 rounded-2xl border border-slate-700 shadow-xl">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-bold text-indigo-400">Grafik Profit</h3>
                            <input type="date" id="filter-tgl" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs">
                        </div>
                        <div class="h-64">
                            <canvas id="chartProfit"></canvas>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-slate-800/50 p-5 rounded-2xl border border-green-500/20">
                            <h4 class="text-xs font-bold text-green-400 uppercase mb-4">Laku Keras (Top 5)</h4>
                            <div id="list-laku" class="space-y-3 text-sm">
                                <p class="opacity-30 italic">Belum ada data...</p>
                            </div>
                        </div>

                        <div class="bg-slate-800/50 p-5 rounded-2xl border border-red-500/20">
                            <h4 class="text-xs font-bold text-red-400 uppercase mb-4">Stok Mati (Tidak Laku)</h4>
                            <div id="list-mati" class="space-y-3 text-sm">
                                <p class="opacity-30 italic">Belum ada data...</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            initChart();
        }

        // Fungsi Grafik (Dummy dulu)
        function initChart() {
            const ctx = document.getElementById('chartProfit').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'],
                    datasets: [{
                        label: 'Profit',
                        data: [120, 190, 300, 500, 200, 300, 450],
                        borderColor: '#6366f1',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(99, 102, 241, 0.1)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { display: false }, x: { grid: { display: false } } }
                }
            });
        }

        // Jam Digital
        setInterval(() => {
            document.getElementById('jam').innerText = new Date().toLocaleString();
        }, 1000);

        // Jalankan dashboard pertama kali
        window.onload = () => {
            gantiMenu('dashboard');
        };
    </script>
</body>
</html>
