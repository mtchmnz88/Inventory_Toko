html, body { height: 100%; margin: 0; overflow: hidden; }
.app-shell { height: 100%; width: 100%; display: flex; overflow: hidden; }

@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

.tbl-row { transition: background 0.15s; }

@media (max-width: 768px) {

  <script>
// ==================== GLOBALS ====================
let allData = [];
let currentPage = 'dashboard';
let cartItems = [];
let editingId = null;

const defaultConfig = {
  app_title: 'Toko Saya',
  footer_text: 'Terima kasih!',
  background_color: '#020617',
  surface_color: '#1e293b',
  text_color: '#e2e8f0',
  primary_color: '#6366f1',
  secondary_color: '#10b981',
  font_family: 'Plus Jakarta Sans',
  font_size: 14
};

// ==================== HELPERS ====================
function showToast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function showConfirm(msg, onYes) {
  const c = document.getElementById('confirm-container');
  c.innerHTML = `<div class="confirm-overlay" onclick="this.remove()">
    <div class="confirm-box" onclick="event.stopPropagation()">
      <p class="text-white font-semibold mb-4">${msg}</p>
      <div class="flex gap-3 justify-end">
        <button class="btn-primary px-4 py-2 text-sm" id="confirm-yes">Ya</button>
        <button class="px-4 py-2 text-sm rounded-lg bg-slate-700 text-slate-300" id="confirm-no">Batal</button>
      </div>
    </div>
  </div>`;
  document.getElementById('confirm-yes').onclick = () => { c.innerHTML = ''; onYes(); };
  document.getElementById('confirm-no').onclick = () => { c.innerHTML = ''; };
}

function fmt(n) { return new Intl.NumberFormat('id-ID').format(n || 0); }
function fmtRp(n) { return 'Rp ' + fmt(n); }
function getBarang() { return allData.filter(d => d.type === 'barang'); }
function getTransaksi() { return allData.filter(d => d.type === 'transaksi'); }
function getMetode() { return allData.filter(d => d.type === 'metode'); }

function generateTrxNo() {
  const now = new Date();
  const d = now.toISOString().slice(0,10).replace(/-/g,'');
  const r = Math.floor(Math.random()*9000)+1000;
  return `TRX-${d}-${r}`;
}

// ==================== CLOCK ====================
function updateClock() {
  const el = document.getElementById('clock');
  if (el) {
    const now = new Date();
    el.textContent = now.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + now.toLocaleTimeString('id-ID');
  }
}
setInterval(updateClock, 1000);
updateClock();

// ==================== NAVIGATION ====================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

function navigateTo(page) {
  currentPage = page;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
  editingId = null;
  cartItems = [];

  const titles = { dashboard:'Dashboard', barang:'Kelola Barang', transaksi:'Transaksi', referensi:'Daftar Referensi', report:'Report Penjualan' };
  document.getElementById('page-title').textContent = titles[page] || '';

  document.querySelectorAll('.nav-btn').forEach(b => {
    const isActive = b.dataset.nav === page;
    b.className = `nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${isActive ? 'bg-indigo-500/15 text-indigo-400' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`;
  });

  renderPage();
}

function renderPage() {
  const c = document.getElementById('page-content');
  switch(currentPage) {
    case 'dashboard': renderDashboard(c); break;
    case 'barang': renderBarang(c); break;
    case 'transaksi': renderTransaksi(c); break;
    case 'referensi': renderReferensi(c); break;
    case 'report': renderReport(c); break;
  }
  lucide.createIcons();
}

// ==================== SCANNER WITH CAMERA ====================
let scannerStream = null;
let scannerActive = false;
let scannerReader = null;

function openScanner(callback) {
  const c = document.getElementById('confirm-container');
  c.innerHTML = `<div class="scanner-overlay" onclick="closeScannerOverlay()">
    <div onclick="event.stopPropagation()" style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="absolute top-6 left-6 z-50">
        <button class="p-2 rounded-lg bg-slate-900/80 text-white hover:bg-slate-800" onclick="closeScannerOverlay()">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>
      <video id="video-scanner" style="width:100%;height:100%;object-fit:cover;" playsinline autoplay muted></video>
      <canvas id="canvas-scanner" style="display:none;"></canvas>
      <div id="scanner-status" class="absolute top-20 left-1/2 transform -translate-x-1/2 text-center bg-slate-900/80 px-6 py-3 rounded-xl">
        <p class="text-white font-semibold text-sm">🔄 Membuka kamera...</p>
      </div>
      <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 text-center bg-slate-900/80 px-6 py-4 rounded-xl">
        <p class="text-white font-semibold mb-3">📸 Arahkan ke barcode</p>
        <div class="flex gap-3">
          <button class="btn-success px-4 py-2 text-sm" onclick="toggleFlash()"><i data-lucide="flashlight" class="w-4 h-4"></i> Flash</button>
          <button class="px-4 py-2 text-sm rounded-lg bg-slate-700 text-slate-300" onclick="closeScannerOverlay()">Tutup</button>
        </div>
      </div>
    </div>
  </div>`;
  
  lucide.createIcons();
  window.currentScanCallback = callback;
  startBarcodeScan();
}

function startBarcodeScan() {
  const videoElement = document.getElementById('video-scanner');
  if (!videoElement) return;

  updateStatus('⏳ Meminta akses kamera...');

  // Try different constraint variations for better compatibility
  const constraints = [
    { video: { facingMode: { ideal: 'environment' } } },
    { video: { facingMode: 'environment' } },
    { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } },
    { video: { width: { ideal: 1280 }, height: { ideal: 720 } } },
    { video: true }
  ];

  function tryConstraint(index) {
    if (index >= constraints.length) {
      updateStatus('❌ Gagal membuka kamera. Periksa izin browser.');
      console.error('All camera constraints failed');
      return;
    }

    console.log('Trying constraint ' + index + ':', constraints[index]);
    navigator.mediaDevices.getUserMedia(constraints[index])
      .then(stream => {
        console.log('Camera stream obtained with constraint ' + index);
        scannerStream = stream;
        videoElement.srcObject = stream;
        updateStatus('✓ Kamera dibuka, tunggu sebentar...');
        
        // Wait for video to be ready with timeout
        let readyTimeout = setTimeout(() => {
          console.warn('Video ready timeout - proceeding anyway');
          handleVideoReady();
        }, 3000);
        
        const handleVideoReady = () => {
          clearTimeout(readyTimeout);
          if (videoElement.videoWidth > 0 && videoElement.videoHeight > 0) {
            videoElement.removeEventListener('loadedmetadata', readyHandler);
            videoElement.removeEventListener('canplay', readyHandler);
            
            console.log('Video ready at ' + videoElement.videoWidth + 'x' + videoElement.videoHeight);
            updateStatus('✓ Kamera aktif & siap scan');
            scannerActive = true;
            
            if (typeof ZXing !== 'undefined') {
              continuousScan(videoElement);
            } else {
              updateStatus('⏳ Loading ZXing...');
              let zxingWait = 0;
              const checkZXing = setInterval(() => {
                if (typeof ZXing !== 'undefined') {
                  clearInterval(checkZXing);
                  console.log('ZXing ready');
                  continuousScan(videoElement);
                } else if (zxingWait++ > 20) {
                  clearInterval(checkZXing);
                  updateStatus('❌ ZXing library failed to load');
                }
              }, 100);
            }
          }
        };
        
        const readyHandler = () => {
          if (videoElement.videoWidth > 0 && videoElement.videoHeight > 0) {
            handleVideoReady();
          }
        };
        
        videoElement.addEventListener('loadedmetadata', readyHandler, { once: true });
        videoElement.addEventListener('canplay', readyHandler, { once: true });
        videoElement.addEventListener('playing', readyHandler, { once: true });
        
        videoElement.play().catch(err => {
          console.error('Play error:', err);
          updateStatus('❌ Video play error: ' + err.message);
          // Try next constraint
          tryConstraint(index + 1);
        });
      })
      .catch(err => {
        console.error('getUserMedia constraint ' + index + ' failed:', err.name, err.message);
        
        // Check for specific errors
        if (err.name === 'NotAllowedError') {
          updateStatus('❌ Izin kamera ditolak. Ubah di pengaturan browser.');
          return;
        } else if (err.name === 'NotFoundError') {
          updateStatus('❌ Kamera tidak ditemukan.');
          return;
        } else if (err.name === 'NotReadableError') {
          updateStatus('❌ Kamera sedang digunakan aplikasi lain.');
          return;
        }
        
        // Try next constraint
        tryConstraint(index + 1);
      });
  }

  // Check permissions first
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'camera' }).then(permission => {
      console.log('Camera permission:', permission.state);
      if (permission.state === 'denied') {
        updateStatus('❌ Izin kamera ditolak di browser. Ubah pengaturan.');
        return;
      }
      tryConstraint(0);
    }).catch(() => {
      // If permissions API not available, just try
      tryConstraint(0);
    });
  } else {
    tryConstraint(0);
  }
}

function updateStatus(msg) {
  const el = document.getElementById('scanner-status');
  if (el) el.innerHTML = `<p class="text-white font-semibold text-sm">${msg}</p>`;
}

function continuousScan(videoElement) {
  if (!scannerActive || !videoElement.srcObject || videoElement.videoWidth <= 0) {
    if (scannerActive) setTimeout(() => continuousScan(videoElement), 100);
    return;
  }

  const canvas = document.getElementById('canvas-scanner');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  
  canvas.width = videoElement.videoWidth;
  canvas.height = videoElement.videoHeight;

  try {
    ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
    
    // Initialize reader if needed
    if (typeof ZXing !== 'undefined' && !scannerReader) {
      try {
        scannerReader = new ZXing.BrowserMultiFormatReader();
        console.log('ZXing reader initialized');
      } catch(e) {
        console.error('ZXing reader init error:', e);
      }
    }
    
    // Try to decode
    if (scannerReader) {
      try {
        const result = scannerReader.decodeFromCanvas(canvas);
        if (result && result.getText) {
          const barcode = result.getText();
          if (barcode && barcode.trim()) {
            console.log('Barcode decoded:', barcode);
            updateStatus('✓ Barcode: ' + barcode);
            showToast('✓ Barcode terbaca: ' + barcode, 'success');
            
            // Stop scanning immediately
            scannerActive = false;
            if (scannerStream) {
              scannerStream.getTracks().forEach(track => track.stop());
              scannerStream = null;
            }
            
            // Close overlay and call callback
            const container = document.getElementById('confirm-container');
            if (container) container.innerHTML = '';
            
            if (window.currentScanCallback) {
              const callback = window.currentScanCallback;
              window.currentScanCallback = null;
              callback(barcode);
            }
            return;
          }
        }
      } catch(e) {
        // No barcode found in this frame - continue scanning
        // This is normal, not an error
      }
    }
  } catch (e) {
    console.error('Scan error:', e);
  }

  if (scannerActive) {
    setTimeout(() => continuousScan(videoElement), 50);
  }
}

function closeScannerOverlay() {
  scannerActive = false;
  if (scannerStream) {
    scannerStream.getTracks().forEach(track => track.stop());
    scannerStream = null;
  }
  if (scannerReader) {
    try { scannerReader.reset(); } catch(e) {}
    scannerReader = null;
  }
  const container = document.getElementById('confirm-container');
  if (container) container.innerHTML = '';
  window.currentScanCallback = null;
}

function toggleFlash() {
  if (!scannerStream) return;
  
  const track = scannerStream.getVideoTracks()[0];
  if (!track) return;

  try {
    const settings = track.getSettings?.() || {};
    const currentTorch = settings.torch || false;
    
    track.applyConstraints({ advanced: [{ torch: !currentTorch }] })
      .then(() => showToast(!currentTorch ? '💡 Flash ON' : '💡 Flash OFF', 'info'))
      .catch(err => showToast('⚠️ Flash tidak support', 'warn'));
  } catch(e) {}
}

// ==================== DASHBOARD ====================
function renderDashboard(c) {
  const barangList = getBarang();
  const trxList = getTransaksi();

  const totalProfit = barangList.reduce((s,b) => s + (b.profit||0), 0);
  const totalKas = barangList.reduce((s,b) => s + (b.kas_masuk||0), 0);
  const totalTrx = trxList.length;
  const totalBarang = barangList.length;

  // Top sold items
  const sorted = [...barangList].sort((a,b) => (b.terjual||0) - (a.terjual||0));
  const topSold = sorted.filter(b => (b.terjual||0) > 0).slice(0,5);
  const notSold = barangList.filter(b => (b.terjual||0) === 0);

  // Profit chart data (last 7 days from transactions)
  const days = [];
  for (let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const label = d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});
    const dayTrx = trxList.filter(t => t.tgl_transaksi === key);
    const revenue = dayTrx.reduce((s,t) => s + (t.grand_total||0), 0);
    days.push({key, label, revenue});
  }
  const maxRev = Math.max(...days.map(d=>d.revenue), 1);

  c.innerHTML = `<div class="fade-up space-y-6">
    <!-- Stats -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="stat-card card-glass p-5">
        <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-xl bg-indigo-500/20 flex items-center justify-center"><i data-lucide="trending-up" class="w-5 h-5 text-indigo-400"></i></div></div>
        <p class="text-2xl font-bold text-white">${fmtRp(totalProfit)}</p>
        <p class="text-xs text-slate-500 mt-1">Total Profit</p>

function findBarangByBarcode(bc) {
  const found = getBarang().find(b => b.barcode === bc);
  if (found) {
    document.getElementById('bf-name').value = found.name||'';

    document.getElementById('bf-hjual').value = found.harga_jual||0;
    showToast('Barang ditemukan: ' + found.name, 'success');
  }
}

async function saveBarang(bid) {
  const name = document.getElementById('bf-name').value.trim();
  if (!name) { showToast('Nama barang wajib diisi','error'); return; }

  const hbeli = parseFloat(document.getElementById('bf-hbeli').value)||0;
  const hjual = parseFloat(document.getElementById('bf-hjual').value)||0;
  const stok = parseFloat(document.getElementById('bf-stok').value)||0;
  const masuk = parseFloat(document.getElementById('bf-masuk').value)||0;
  const hilang = parseFloat(document.getElementById('bf-hilang').value)||0;
  const rusak = parseFloat(document.getElementById('bf-rusak').value)||0;

  // Find existing to get terjual
  const existing = bid ? allData.find(d => d.__backendId === bid) : null;
  const terjual = existing ? (existing.terjual||0) : 0;
  const stokAkhir = stok + masuk - hilang - rusak - terjual;
  const profit = terjual * (hjual - hbeli);
  const kasMasuk = terjual * hjual;

  const record = {
    type: 'barang', name,
    barcode: document.getElementById('bf-barcode').value.trim(),
    harga_beli: hbeli, harga_jual: hjual,
    stok_awal: stok, barang_masuk: masuk, barang_hilang: hilang, barang_rusak: rusak,
    terjual, stok_akhir: stokAkhir, kas_masuk: kasMasuk, profit
  };

  if (bid && existing) {
    const res = await window.dataSdk.update({...existing, ...record});
    if (res.isOk) showToast('Barang diupdate','success'); else showToast('Gagal update','error');
  } else {
    if (allData.filter(d=>d.type==='barang').length >= 999) { showToast('Batas 999 barang tercapai','error'); return; }
    const res = await window.dataSdk.create(record);
    if (res.isOk) showToast('Barang ditambahkan','success'); else showToast('Gagal menambahkan','error');
  }

  // Check stock notifications
  if (stokAkhir <= 0) showToast('⚠️ Stok ' + name + ' HABIS! Segera isi stok / Stok Opname', 'error');
  else if (stokAkhir <= 10) showToast('⚠️ Stok ' + name + ' Hampir Habis ('+stokAkhir+' pcs)', 'warn');
}

function editBarang(bid) {
  const b = allData.find(d => d.__backendId === bid);
  if (b) showBarangForm(b);
}

function deleteBarang(bid) {
  const b = allData.find(d => d.__backendId === bid);
  if (!b) return;
  showConfirm('Hapus barang "' + b.name + '"?', async () => {
    const res = await window.dataSdk.delete(b);
    if (res.isOk) showToast('Barang dihapus','success'); else showToast('Gagal menghapus','error');
  });
}

function onTfItemChange() {
  const sel = document.getElementById('tf-item');
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('tf-price').value = opt.dataset.price || '';
}

function scanForTrx() {
  openScanner(bc => {
    const found = getBarang().find(b => b.barcode === bc);
    if (found) {
      const sel = document.getElementById('tf-item');
      sel.value = found.__backendId;
      document.getElementById('tf-price').value = found.harga_jual || 0;
      showToast('Barang ditemukan: ' + found.name, 'success');
    } else {
      showToast('Barcode tidak ditemukan', 'error');
    }
  });
}

function addCartItem() {
  const sel = document.getElementById('tf-item');
  const bid = sel.value;
  if (!bid) { showToast('Pilih barang','error'); return; }
  const b = allData.find(d => d.__backendId === bid);
  if (!b) return;
  const qty = parseInt(document.getElementById('tf-qty').value)||1;
  const price = b.harga_jual||0;

  const existing = cartItems.find(c => c.bid === bid);
  if (existing) { existing.qty += qty; existing.jumlah = existing.qty * existing.price; }
  else cartItems.push({bid, name: b.name, price, qty, jumlah: price*qty, harga_beli: b.harga_beli||0});

  renderCart();
  sel.value = '';
  document.getElementById('tf-price').value = '';
  document.getElementById('tf-qty').value = '1';
}

function removeCartItem(idx) { cartItems.splice(idx,1); renderCart(); }

function renderCart() {
  const ct = document.getElementById('cart-table');
  if (!ct) return;
  const grand = cartItems.reduce((s,c) => s + c.jumlah, 0);

  ct.innerHTML = cartItems.length ? `<table class="w-full text-sm mb-2">
    <thead><tr class="text-slate-400 text-xs border-b border-slate-700">
      <th class="p-2 text-left">Item</th><th class="p-2 text-right">Harga</th><th class="p-2 text-right">Qty</th><th class="p-2 text-right">Jumlah</th><th class="p-2"></th>
    </tr></thead>
    <tbody>${cartItems.map((c,i) => `<tr class="border-b border-slate-800/50">
      <td class="p-2">${c.name}</td><td class="p-2 text-right font-mono">${fmtRp(c.price)}</td><td class="p-2 text-right">${c.qty}</td><td class="p-2 text-right font-mono font-bold">${fmtRp(c.jumlah)}</td>
      <td class="p-2 text-center"><button class="text-red-400" onclick="removeCartItem(${i})"><i data-lucide="x" class="w-4 h-4"></i></button></td>
    </tr>`).join('')}</tbody>
  </table>` : '<p class="text-slate-500 text-sm py-2">Keranjang kosong</p>';

  const gEl = document.getElementById('tf-grand');
  if (gEl) gEl.value = fmtRp(grand);
  calcChange();
  lucide.createIcons();
}

function calcChange() {
  const grand = cartItems.reduce((s,c) => s + c.jumlah, 0);
  const cash = parseFloat(document.getElementById('tf-cash')?.value)||0;
  const qris = parseFloat(document.getElementById('tf-qris')?.value)||0;
  const change = (cash + qris) - grand;
  const el = document.getElementById('tf-change');
  if (el) el.value = fmtRp(Math.max(change, 0));
}

async function saveTransaksi() {
  if (!cartItems.length) { showToast('Keranjang kosong','error'); return; }
  const grand = cartItems.reduce((s,c) => s + c.jumlah, 0);
  const cash = parseFloat(document.getElementById('tf-cash').value)||0;
  const qris = parseFloat(document.getElementById('tf-qris').value)||0;
  if (cash + qris < grand) { showToast('Pembayaran kurang','error'); return; }

  const record = {
    type: 'transaksi',
    no_transaksi: document.getElementById('tf-no').value,
    tgl_transaksi: document.getElementById('tf-tgl').value,
    jam_transaksi: document.getElementById('tf-jam').value,
    items_json: JSON.stringify(cartItems),
    grand_total: grand,
    bayar_cash: cash,
    bayar_qris: qris,
    metode_qris: qris > 0 ? document.getElementById('tf-qris-method').value : '',
    kembali: Math.max((cash+qris)-grand, 0),
    status: 'completed'
  };

  if (allData.filter(d=>d.type==='transaksi').length >= 999) { showToast('Batas transaksi tercapai','error'); return; }

  const res = await window.dataSdk.create(record);
  if (!res.isOk) { showToast('Gagal menyimpan','error'); return; }

  // Update stock for each sold item
  for (const item of cartItems) {
    const b = allData.find(d => d.__backendId === item.bid);
    if (b) {
      const newTerjual = (b.terjual||0) + item.qty;
      const sa = (b.stok_awal||0) + (b.barang_masuk||0) - (b.barang_hilang||0) - (b.barang_rusak||0) - newTerjual;
      const profit = newTerjual * ((b.harga_jual||0) - (b.harga_beli||0));
      const kas = newTerjual * (b.harga_jual||0);
      await window.dataSdk.update({...b, terjual: newTerjual, stok_akhir: sa, profit, kas_masuk: kas});
      if (sa <= 0) showToast('⚠️ Stok ' + b.name + ' HABIS!', 'error');
      else if (sa <= 10) showToast('⚠️ Stok ' + b.name + ' Hampir Habis', 'warn');
    }
  }

  showToast('Transaksi berhasil disimpan!','success');

  // Print receipt
  setTimeout(() => cetakStrukData(record, cartItems), 500);
  cartItems = [];
}

function cetakStruk(bid) {
  const t = allData.find(d => d.__backendId === bid);
  if (!t) return;
  let items = [];
  try { items = JSON.parse(t.items_json||'[]'); } catch(e) {}
  cetakStrukData(t, items);
}

  <div class="line"></div>
  <div class="center"><p>${footerTxt}</p></div>
  <script>setTimeout(()=>window.print(),300)<\/script></body></html>`);
}

function applyReportFilter() {
  const filter = document.getElementById('rpt-filter')?.value || 'all';
  const dateVal = document.getElementById('rpt-date')?.value || '';
  const trxList = getTransaksi();

  if (filter === 'daily' && dateVal) {
    filtered = trxList.filter(t => t.tgl_transaksi === dateVal);

  const totalPendapatan = filtered.reduce((s,t) => s + (t.grand_total||0), 0);
