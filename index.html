<!doctype html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPOS v3.7 - Full Enterprise</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f1f5f9; overflow: hidden; }
        .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; }
        .input-field { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; color: white; width: 100%; transition: 0.3s; }
        .input-field:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
        .sidebar-item { transition: 0.3s; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; color: #94a3b8; }
        .sidebar-item.active { background: #6366f1; color: white; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        .qris-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="h-full flex">

    <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-6 no-print">
        <div class="flex items-center gap-3 px-2 mb-4">
            <div class="bg-indigo-500 p-2 rounded-xl shadow-lg shadow-indigo-500/30"><i data-lucide="zap" class="text-white"></i></div>
            <h1 class="font-extrabold text-2xl tracking-tighter italic">Pro<span class="text-indigo-500">POS</span></h1>
        </div>
        <nav class="flex flex-col gap-2">
            <div onclick="switchMenu('dashboard')" id="nav-dashboard" class="sidebar-item active"><i data-lucide="layout-dashboard"></i> Dashboard</div>
            <div onclick="switchMenu('barang')" id="nav-barang" class="sidebar-item"><i data-lucide="package"></i> Kelola Barang</div>
            <div onclick="switchMenu('transaksi')" id="nav-transaksi" class="sidebar-item"><i data-lucide="shopping-cart"></i> Transaksi</div>
            <div onclick="switchMenu('report')" id="nav-report" class="sidebar-item"><i data-lucide="bar-chart-3"></i> Report Penjualan</div>
            <div onclick="switchMenu('setting')" id="nav-setting" class="sidebar-item"><i data-lucide="settings"></i> Setting</div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-950/50 no-print">
            <h2 id="menu-title" class="text-xl font-black uppercase tracking-widest text-indigo-400">Dashboard</h2>
            <div id="clock" class="text-sm font-mono text-slate-500 bg-slate-900 px-4 py-2 rounded-full border border-slate-800"></div>
        </header>
        
        <div id="main-view" class="flex-1 overflow-y-auto p-8">
            </div>
    </main>

    <div id="qris-modal" class="hidden qris-overlay">
        <div class="bg-white p-8 rounded-[40px] text-center max-w-sm w-full mx-4 shadow-2xl text-slate-900 border-8 border-indigo-500">
            <h3 class="font-black text-2xl mb-1" id="qris-provider-title">PAYMENT</h3>
            <p id="qris-target-phone" class="text-xs text-slate-400 mb-4 font-bold"></p>
            <div class="bg-slate-50 p-6 rounded-3xl mb-6 border-2 border-slate-100">
                <img id="qris-image" src="" alt="QRIS" class="w-full h-auto">
            </div>
            <p class="text-xs text-slate-400 uppercase font-bold tracking-widest">Total Bayar</p>
            <div id="qris-amount-display" class="text-4xl font-black text-indigo-600 mb-8">Rp 0</div>
            <button onclick="confirmPayment()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl active:scale-95 transition-transform">KONFIRMASI BAYAR</button>
            <button onclick="closeQris()" class="mt-4 text-slate-400 font-bold hover:text-red-500">BATALKAN</button>
        </div>
    </div>

    <div id="scanner-ui" class="hidden fixed inset-0 bg-black/98 z-[9999] flex flex-col items-center justify-center">
        <div class="relative w-80 h-80 border-4 border-indigo-500 rounded-[50px] overflow-hidden shadow-[0_0_50px_rgba(99,102,241,0.5)]">
            <video id="scan-v" class="w-full h-full object-cover"></video>
            <div class="absolute inset-x-0 top-1/2 h-1 bg-red-500 shadow-[0_0_20px_red] animate-bounce"></div>
        </div>
        <p class="mt-8 text-white font-bold tracking-widest animate-pulse">MENUNGGU SCAN BARCODE...</p>
        <button onclick="stopScan()" class="mt-6 bg-white text-black px-12 py-3 rounded-full font-black">TUTUP</button>
    </div>

    <script>
        // --- CORE DATA ---
        let db_items = JSON.parse(localStorage.getItem('propos_v37_items')) || [];
        let db_sales = JSON.parse(localStorage.getItem('propos_v37_sales')) || [];
        let config = JSON.parse(localStorage.getItem('propos_v37_cfg')) || {
            name: "TOKO BERKAH",
            address: "Jl. Digital No. 1",
            phones: { shopeepay: "", gopay: "", ovo: "", dana: "", linkaja: "" }
        };
        let cart = [];

        const fmtRp = (n) => "Rp " + new Intl.NumberFormat('id-ID').format(n);

        function switchMenu(m) {
            document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
            document.getElementById('nav-'+m).classList.add('active');
            document.getElementById('menu-title').innerText = m === 'report' ? 'Report Penjualan' : m;
            const v = document.getElementById('main-view');

            if(m === 'dashboard') renderDashboard(v);
            if(m === 'barang') renderKelolaBarang(v);
            if(m === 'transaksi') renderTransaksi(v);
            if(m === 'report') renderReport(v);
            if(m === 'setting') renderSetting(v);
            lucide.createIcons();
        }

        // --- DASHBOARD ---
        function renderDashboard(v) {
            v.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="card-glass p-8 border-b-4 border-indigo-500"><p class="text-slate-400 text-sm font-bold uppercase">Produk Aktif</p><h2 class="text-4xl font-black">${db_items.length}</h2></div>
                    <div class="card-glass p-8 border-b-4 border-green-500"><p class="text-slate-400 text-sm font-bold uppercase">Sales Hari Ini</p><h2 class="text-4xl font-black">${db_sales.filter(s=>s.date===new Date().toLocaleDateString()).length}</h2></div>
                    <div class="card-glass p-8 border-b-4 border-yellow-500"><p class="text-slate-400 text-sm font-bold uppercase">Limit Stok</p><h2 class="text-4xl font-black">${db_items.filter(i=>calculateSisa(i)<10).length}</h2></div>
                </div>
                <div class="card-glass p-12 text-center">
                    <div class="w-24 h-24 bg-indigo-500/20 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="store" class="w-12 h-12 text-indigo-500"></i></div>
                    <h1 class="text-3xl font-black uppercase tracking-tighter">Sistem Kasir ${config.name}</h1>
                    <p class="text-slate-500 mt-2">Pilih menu di samping untuk memulai operasional.</p>
                </div>`;
        }

        // --- KELOLA BARANG ---
        function renderKelolaBarang(v) {
            v.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                    <div class="card-glass p-6 h-fit space-y-4 sticky top-0">
                        <h3 class="font-black text-indigo-400 flex items-center gap-2"><i data-lucide="plus-circle"></i> UPDATE STOK</h3>
                        <div class="flex gap-2">
                            <input id="k-barcode" class="input-field font-bold" placeholder="Scan Barcode">
                            <button onclick="startScan('k-barcode')" class="bg-indigo-600 p-3 rounded-xl"><i data-lucide="camera"></i></button>
                        </div>
                        <input id="k-nama" class="input-field" placeholder="Nama Produk">
                        <select id="k-tipe" class="input-field">
                            <option value="awal">STOK AWAL</option>
                            <option value="tambah">STOK TAMBAH</option>
                            <option value="rusak">STOK RUSAK</option>
                            <option value="hilang">STOK HILANG</option>
                            <option value="retur">STOK RETUR</option>
                        </select>
                        <input id="k-qty" type="number" class="input-field" placeholder="Jumlah (Qty)">
                        <input id="k-beli" type="number" class="input-field" placeholder="Harga Beli">
                        <input id="k-jual" type="number" class="input-field" placeholder="Harga Jual">
                        <button onclick="saveItem()" class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-xl font-black transition-all">SIMPAN DATA</button>
                    </div>
                    <div class="lg:col-span-3 card-glass p-6">
                        <table class="w-full text-left">
                            <thead class="text-slate-500 text-[10px] uppercase tracking-widest border-b border-slate-800">
                                <tr><th class="p-3">Info Produk</th><th class="p-3">Harga</th><th class="p-3">Sisa Stok</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr>
                            </thead>
                            <tbody id="k-body"></tbody>
                        </table>
                    </div>
                </div>`;
            loadItemTable();
        }

        function calculateSisa(i) {
            return (parseInt(i.awal) + parseInt(i.tambah) + parseInt(i.retur)) - (parseInt(i.rusak) + parseInt(i.hilang) + parseInt(i.terjual));
        }

        function saveItem() {
            const barcode = document.getElementById('k-barcode').value;
            const nama = document.getElementById('k-nama').value;
            const tipe = document.getElementById('k-tipe').value;
            const qty = parseInt(document.getElementById('k-qty').value) || 0;
            const beli = parseInt(document.getElementById('k-beli').value) || 0;
            const jual = parseInt(document.getElementById('k-jual').value) || 0;

            if(!barcode || !nama) return alert("Barcode & Nama Wajib Isi!");

            let item = db_items.find(i => i.barcode === barcode);
            if(item) {
                item.nama = nama; item.beli = beli; item.jual = jual;
                item[tipe] = (tipe === 'awal') ? qty : (parseInt(item[tipe]) + qty);
            } else {
                item = { barcode, nama, beli, jual, awal:0, tambah:0, rusak:0, hilang:0, retur:0, terjual:0 };
                item[tipe] = qty;
                db_items.push(item);
            }
            localStorage.setItem('propos_v37_items', JSON.stringify(db_items));
            renderKelolaBarang(document.getElementById('main-view'));
        }

        function loadItemTable() {
            const tbody = document.getElementById('k-body');
            tbody.innerHTML = db_items.map((i, idx) => {
                const sisa = calculateSisa(i);
                let badge = sisa <= 0 ? '<span class="status-badge bg-red-500/10 text-red-500">HABIS</span>' : 
                            (sisa < 10 ? '<span class="status-badge bg-yellow-500/10 text-yellow-500">LIMIT</span>' : 
                            '<span class="status-badge bg-green-500/10 text-green-500">READY</span>');
                return `<tr class="border-b border-slate-800/50 hover:bg-slate-800/20 transition-all">
                    <td class="p-3"><b>${i.nama}</b><br><small class="text-slate-500 font-mono">${i.barcode}</small></td>
                    <td class="p-3 text-sm">B: ${fmtRp(i.beli)}<br><b class="text-indigo-400">J: ${fmtRp(i.jual)}</b></td>
                    <td class="p-3 font-black text-xl">${sisa}</td>
                    <td class="p-3">${badge}</td>
                    <td class="p-3"><button onclick="deleteItem(${idx})" class="text-red-500 hover:scale-125 transition-transform"><i data-lucide="trash-2" class="w-5 h-5"></i></button></td>
                </tr>`;
            }).join('');
            lucide.createIcons();
        }

        function deleteItem(idx) { if(confirm("Hapus produk ini secara permanen?")) { db_items.splice(idx, 1); localStorage.setItem('propos_v37_items', JSON.stringify(db_items)); loadItemTable(); } }

        // --- TRANSAKSI ---
        function renderTransaksi(v) {
            cart = [];
            v.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="card-glass p-6 space-y-4">
                        <div class="flex gap-2">
                            <input id="t-scan" class="input-field text-xl font-bold" placeholder="Scan Barcode Belanjaan...">
                            <button onclick="startScan('t-scan')" class="bg-indigo-600 px-6 rounded-xl"><i data-lucide="camera"></i></button>
                        </div>
                        <div id="t-cart-list" class="space-y-3 min-h-[400px] max-h-[500px] overflow-y-auto pr-2">
                            <div class="text-center text-slate-600 mt-20"><i data-lucide="shopping-bag" class="w-16 h-16 mx-auto opacity-20 mb-4"></i><p>Keranjang Kosong</p></div>
                        </div>
                        <div class="border-t border-slate-700 pt-6 flex justify-between items-end">
                            <div><p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Grand Total</p><h2 id="t-grand-total" class="text-5xl font-black text-indigo-400">Rp 0</h2></div>
                            <button onclick="cart=[];updateCartUI()" class="text-red-500 font-bold text-xs uppercase hover:underline">Reset</button>
                        </div>
                    </div>

                    <div class="card-glass p-8 space-y-6">
                        <h3 class="font-black text-xl border-b border-slate-800 pb-4">PEMBAYARAN</h3>
                        
                        <div>
                            <label class="text-[10px] text-slate-500 font-bold">METODE BAYAR</label>
                            <select id="t-method" class="input-field font-bold" onchange="togglePayInputs()">
                                <option value="cash">CASH / TUNAI</option>
                                <option value="qris">QRIS (OVO/GOPAY/DANA/DLL)</option>
                                <option value="split">CASH & QRIS (CAMPURAN)</option>
                            </select>
                        </div>

                        <div id="ui-cash" class="space-y-2">
                            <label class="text-[10px] text-slate-500 font-bold">NOMINAL CASH</label>
                            <input id="t-input-cash" type="number" class="input-field text-3xl font-black text-green-400" placeholder="0" oninput="calculateTrx()">
                        </div>

                        <div id="ui-qris" class="hidden space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[10px] text-slate-500 font-bold">E-WALLET</label>
                                    <select id="t-qris-provider" class="input-field font-bold">
                                        <option value="shopeepay">SHOPEEPAY</option>
                                        <option value="gopay">GOPAY</option>
                                        <option value="ovo">OVO</option>
                                        <option value="dana">DANA</option>
                                        <option value="linkaja">LINK AJA</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-500 font-bold">NOMINAL QRIS</label>
                                    <input id="t-input-qris" type="number" class="input-field text-2xl font-black text-indigo-400" placeholder="0" oninput="calculateTrx()">
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-950 p-6 rounded-3xl border border-slate-800 flex justify-between items-center">
                            <span class="font-bold text-slate-500">KEMBALIAN</span>
                            <span id="ui-kembali" class="text-3xl font-black text-green-500">Rp 0</span>
                        </div>

                        <button onclick="handleProcessPay()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-6 rounded-3xl font-black text-2xl shadow-2xl shadow-indigo-500/20 active:scale-95 transition-all">SELESAIKAN TRANSAKSI</button>
                    </div>
                </div>`;
            document.getElementById('t-scan').addEventListener('change', (e) => handleScan(e.target.value));
        }

        function handleScan(code) {
            const item = db_items.find(i => i.barcode === code);
            if(!item) return alert("BARANG TIDAK TERDAFTAR!");
            if(calculateSisa(item) <= 0) return alert("STOK HABIS!");

            const inCart = cart.find(c => c.barcode === code);
            if(inCart) {
                alert("Data sudah di scan. Gunakan tombol (+) untuk menambah jumlah.");
            } else {
                cart.push({...item, qty: 1});
            }
            updateCartUI();
            document.getElementById('t-scan').value = "";
        }

        function updateCartUI() {
            const list = document.getElementById('t-cart-list');
            if(cart.length === 0) {
                list.innerHTML = `<div class="text-center text-slate-600 mt-20"><i data-lucide="shopping-bag" class="w-16 h-16 mx-auto opacity-20 mb-4"></i><p>Keranjang Kosong</p></div>`;
            } else {
                list.innerHTML = cart.map((c, idx) => `
                    <div class="flex justify-between items-center p-4 bg-slate-800/40 rounded-2xl border border-slate-700/50">
                        <div class="flex-1">
                            <h4 class="font-black text-white leading-tight uppercase text-sm">${c.nama}</h4>
                            <p class="text-[10px] text-slate-500 mt-1">${fmtRp(c.jual)} x ${c.qty}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center bg-slate-900 rounded-xl p-1 border border-slate-700">
                                <button onclick="updateQty(${idx},-1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-800 rounded-lg">-</button>
                                <span class="w-10 text-center font-bold">${c.qty}</span>
                                <button onclick="updateQty(${idx},1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-800 rounded-lg">+</button>
                            </div>
                            <button onclick="cart.splice(${idx},1);updateCartUI()" class="text-red-500/50 hover:text-red-500 ml-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>`).join('');
            }
            calculateTrx();
            lucide.createIcons();
        }

        function updateQty(idx, delta) {
            const item = db_items.find(i => i.barcode === cart[idx].barcode);
            const nextQty = cart[idx].qty + delta;
            if(nextQty > calculateSisa(item) + cart[idx].qty) return alert("Stok tidak mencukupi!");
            if(nextQty < 1) cart.splice(idx, 1);
            else cart[idx].qty = nextQty;
            updateCartUI();
        }

        function calculateTrx() {
            const total = cart.reduce((acc, c) => acc + (c.jual * c.qty), 0);
            window.currentTotal = total;
            document.getElementById('t-grand-total').innerText = fmtRp(total);
            
            const method = document.getElementById('t-method').value;
            const cash = parseInt(document.getElementById('t-input-cash').value) || 0;
            const qris = parseInt(document.getElementById('t-input-qris').value) || 0;

            let kembali = 0;
            if(method === 'cash') kembali = cash - total;
            if(method === 'split') kembali = (cash + qris) - total;

            document.getElementById('ui-kembali').innerText = fmtRp(kembali > 0 ? kembali : 0);
        }

        function togglePayInputs() {
            const m = document.getElementById('t-method').value;
            document.getElementById('ui-cash').className = m === 'qris' ? 'hidden' : 'space-y-2';
            document.getElementById('ui-qris').className = m === 'cash' ? 'hidden' : 'space-y-4';
            calculateTrx();
        }

        // --- PAYMENT & QRIS ---
        function handleProcessPay() {
            if(cart.length === 0) return alert("Keranjang Kosong!");
            const method = document.getElementById('t-method').value;
            const total = window.currentTotal;

            if(method === 'qris' || method === 'split') {
                const prov = document.getElementById('t-qris-provider').value;
                const phone = config.phones[prov];
                const nominal = method === 'qris' ? total : (parseInt(document.getElementById('t-input-qris').value) || 0);

                if(!phone) return alert("Nomor HP " + prov.toUpperCase() + " belum disetting!");

                document.getElementById('qris-modal').classList.remove('hidden');
                document.getElementById('qris-provider-title').innerText = "QRIS " + prov.toUpperCase();
                document.getElementById('qris-target-phone').innerText = "Tujuan: " + phone;
                document.getElementById('qris-amount-display').innerText = fmtRp(nominal);
                document.getElementById('qris-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=qris://${phone}/${nominal}`;
            } else {
                finishTransaction();
            }
        }

        function confirmPayment() {
            alert("NOMINAL YANG DIBAYAR BERHASIL!");
            closeQris();
            finishTransaction();
        }

        function finishTransaction() {
            // Potong Stok
            cart.forEach(c => {
                let item = db_items.find(i => i.barcode === c.barcode);
                item.terjual += c.qty;
            });

            const sale = {
                id: "INV-" + Date.now(),
                date: new Date().toLocaleDateString(),
                total: window.currentTotal,
                items: [...cart],
                profit: cart.reduce((acc, c) => acc + ((c.jual - c.beli) * c.qty), 0)
            };
            db_sales.push(sale);
            
            localStorage.setItem('propos_v37_items', JSON.stringify(db_items));
            localStorage.setItem('propos_v37_sales', JSON.stringify(db_sales));

            if(confirm("Transaksi Berhasil! Cetak Struk Belanja?")) generatePDF(sale);
            switchMenu('transaksi');
        }

        function closeQris() { document.getElementById('qris-modal').classList.add('hidden'); }

        // --- PDF GENERATOR ---
        function generatePDF(sale) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: [80, 160] });
            
            doc.setFontSize(14); doc.text(config.name, 40, 10, {align: 'center'});
            doc.setFontSize(7); doc.text(config.address, 40, 14, {align: 'center'});
            doc.text(sale.date + " | " + sale.id, 40, 18, {align: 'center'});
            doc.text("----------------------------------------------------------", 40, 22, {align: 'center'});

            let y = 28;
            sale.items.forEach(i => {
                doc.setFont("helvetica", "bold");
                doc.text(i.nama.toUpperCase(), 5, y);
                doc.setFont("helvetica", "normal");
                doc.text(`${i.qty} x ${fmtRp(i.jual)}`, 5, y+4);
                doc.text(fmtRp(i.qty * i.jual), 75, y+4, {align: 'right'});
                y += 10;
            });

            doc.text("----------------------------------------------------------", 40, y, {align: 'center'});
            doc.setFontSize(10);
            doc.text("TOTAL: " + fmtRp(sale.total), 75, y+8, {align: 'right'});
            doc.setFontSize(8);
            doc.text("Terima Kasih Atas Kunjungan Anda", 40, y+18, {align: 'center'});
            
            doc.save(`${sale.id}.pdf`);
        }

        // --- REPORT & SETTING ---
        function renderReport(v) {
            const omzet = db_sales.reduce((acc, s) => acc + s.total, 0);
            const profit = db_sales.reduce((acc, s) => acc + s.profit, 0);
            v.innerHTML = `
                <div class="grid grid-cols-2 gap-6 mb-8">
                    <div class="card-glass p-8 border-l-8 border-indigo-500"><p class="text-xs text-slate-500 uppercase font-bold">Total Omzet</p><h2 class="text-4xl font-black text-indigo-400">${fmtRp(omzet)}</h2></div>
                    <div class="card-glass p-8 border-l-8 border-green-500"><p class="text-xs text-slate-500 uppercase font-bold">Total Laba/Profit</p><h2 class="text-4xl font-black text-green-400">${fmtRp(profit)}</h2></div>
                </div>
                <div class="card-glass p-6">
                    <table class="w-full text-left text-sm">
                        <thead class="text-slate-500 border-b border-slate-800">
                            <tr><th class="p-3">ID TRX</th><th class="p-3">TOTAL</th><th class="p-3">PROFIT</th></tr>
                        </thead>
                        <tbody>${db_sales.slice().reverse().map(s=>`<tr><td class="p-3"><b>${s.id}</b><br><small>${s.date}</small></td><td class="p-3">${fmtRp(s.total)}</td><td class="p-3 text-green-400">${fmtRp(s.profit)}</td></tr>`).join('')}</tbody>
                    </table>
                </div>`;
        }

        function renderSetting(v) {
            v.innerHTML = `
                <div class="card-glass p-10 max-w-2xl mx-auto space-y-6">
                    <h2 class="text-2xl font-black italic">PENGATURAN TOKO & QRIS</h2>
                    <div class="space-y-4">
                        <input id="s-name" class="input-field" value="${config.name}" placeholder="Nama Toko">
                        <input id="s-addr" class="input-field" value="${config.address}" placeholder="Alamat Toko">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="text-[10px] text-slate-500 font-bold">SHOPEEPAY HP</label><input id="s-shopee" class="input-field" value="${config.phones.shopeepay}"></div>
                            <div><label class="text-[10px] text-slate-500 font-bold">GOPAY HP</label><input id="s-gopay" class="input-field" value="${config.phones.gopay}"></div>
                            <div><label class="text-[10px] text-slate-500 font-bold">OVO HP</label><input id="s-ovo" class="input-field" value="${config.phones.ovo}"></div>
                            <div><label class="text-[10px] text-slate-500 font-bold">DANA HP</label><input id="s-dana" class="input-field" value="${config.phones.dana}"></div>
                        </div>
                    </div>
                    <button onclick="saveConfig()" class="w-full bg-indigo-600 py-4 rounded-2xl font-black text-lg">SIMPAN PERUBAHAN</button>
                    <button onclick="localStorage.clear(); location.reload();" class="w-full bg-red-500/10 text-red-500 py-2 rounded-xl text-xs font-bold mt-10">RESET SEMUA DATABASE</button>
                </div>`;
        }

        function saveConfig() {
            config.name = document.getElementById('s-name').value;
            config.address = document.getElementById('s-addr').value;
            config.phones.shopeepay = document.getElementById('s-shopee').value;
            config.phones.gopay = document.getElementById('s-gopay').value;
            config.phones.ovo = document.getElementById('s-ovo').value;
            config.phones.dana = document.getElementById('s-dana').value;
            localStorage.setItem('propos_v37_cfg', JSON.stringify(config));
            alert("Tersimpan!"); location.reload();
        }

        // --- SCANNER CORE ---
        let scannerReader = null;
        function startScan(tid) {
            document.getElementById('scanner-ui').classList.remove('hidden');
            if(!scannerReader) scannerReader = new ZXing.BrowserMultiFormatReader();
            scannerReader.decodeFromVideoDevice(null, 'scan-v', (res) => {
                if(res) { 
                    document.getElementById(tid).value = res.text; 
                    if(tid === 't-scan') handleScan(res.text);
                    stopScan(); 
                }
            });
        }
        function stopScan() { if(scannerReader) scannerReader.reset(); document.getElementById('scanner-ui').classList.add('hidden'); }

        window.onload = () => { switchMenu('dashboard'); setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString('id-ID'); }, 1000); };
    </script>
</body>
</html>
