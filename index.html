<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Inventory Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: sans-serif; }
        .card { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                <i data-lucide="store"></i> POS SAYA
            </h1>
            <div id="jam" class="text-xs font-mono text-slate-500"></div>
        </div>
    </header>

    <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-4">
        
        <div class="grid grid-cols-2 gap-3">
            <div class="card p-4">
                <p class="text-slate-400 text-xs">Total Barang</p>
                <p class="text-xl font-bold">120</p>
            </div>
            <div class="card p-4">
                <p class="text-slate-400 text-xs">Penjualan Hari Ini</p>
                <p class="text-xl font-bold text-green-400">Rp 0</p>
            </div>
        </div>

        <div class="space-y-3">
            <button onclick="alert('Fitur Scanner akan terbuka!')" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95">
                <i data-lucide="scan-barcode"></i> SCAN BARCODE
            </button>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="alert('Buka Data Barang')" class="card p-4 flex flex-col items-center gap-2 active:bg-slate-700">
                    <i data-lucide="package" class="text-indigo-400"></i>
                    <span class="text-sm">Data Barang</span>
                </button>
                <button onclick="alert('Buka Laporan')" class="card p-4 flex flex-col items-center gap-2 active:bg-slate-700">
                    <i data-lucide="clipboard-list" class="text-indigo-400"></i>
                    <span class="text-sm">Laporan</span>
                </button>
            </div>
        </div>

        <div class="card p-4">
            <h3 class="font-semibold mb-3 border-b border-slate-700 pb-2">Transaksi Terakhir</h3>
            <p class="text-center text-slate-500 text-sm py-4 italic">Belum ada transaksi hari ini.</p>
        </div>

    </main>

    <footer class="p-4 text-center text-slate-600 text-[10px]">
        &copy; 2026 POS Inventory System
    </footer>

    <script>
        // Mengaktifkan Ikon Lucide
        lucide.createIcons();

        // Update Jam Real-time
        setInterval(() => {
            const now = new Date();
            document.getElementById('jam').textContent = now.toLocaleTimeString('id-ID');
        }, 1000);
    </script>
</body>
</html>
