<!doctype html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPOS v4.8 - Master Data Edition</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Courier+Prime&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f1f5f9; overflow: hidden; }
        .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; }
        .input-field { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; color: white; width: 100%; transition: 0.3s; }
        .sidebar-item { transition: 0.3s; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; color: #94a3b8; }
        .sidebar-item.active { background: #6366f1; color: white; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        .qris-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        datalist { background-color: #0f172a; color: white; }
    </style>
</head>
<body class="h-full flex">

    <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-4 no-print">
        <div class="flex items-center gap-3 px-2 mb-6 text-white">
            <div class="bg-indigo-500 p-2 rounded-xl"><i data-lucide="zap"></i></div>
            <h1 class="font-extrabold text-2xl italic tracking-tighter">Pro<span class="text-indigo-500">POS</span></h1>
        </div>
        <nav class="flex flex-col gap-1 overflow-y-auto">
            <div onclick="switchMenu('dashboard')" id="nav-dashboard" class="sidebar-item active"><i data-lucide="layout-dashboard"></i> Dashboard</div>
            <div onclick="switchMenu('referensi')" id="nav-referensi" class="sidebar-item"><i data-lucide="book-open"></i> Referensi</div>
            <div onclick="switchMenu('barang')" id="nav-barang" class="sidebar-item"><i data-lucide="package"></i> Stok</div>
            <div onclick="switchMenu('transaksi')" id="nav-transaksi" class="sidebar-item"><i data-lucide="shopping-cart"></i> Transaksi</div>
            <div onclick="switchMenu('report')" id="nav-report" class="sidebar-item"><i data-lucide="bar-chart-3"></i> Report</div>
            <div onclick="switchMenu('setting')" id="nav-setting" class="sidebar-item"><i data-lucide="settings"></i> Setting</div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-950/50">
            <h2 id="menu-title" class="text-xl font-black uppercase text-indigo-400">Dashboard</h2>
            <div id="clock" class="text-sm font-mono text-slate-500 bg-slate-900 px-4 py-2 rounded-full border border-slate-800"></div>
        </header>
        <div id="main-view" class="flex-1 overflow-y-auto p-8"></div>
    </main>

    <div id="qris-modal" class="hidden qris-overlay">
        <div class="bg-white p-8 rounded-[40px] text-center max-w-sm w-full mx-4 text-slate-900 shadow-2xl border-8 border-indigo-500">
            <h3 class="font-black text-xl mb-1 uppercase" id="q-provider-name">QRIS PAYMENT</h3>
            <div class="bg-slate-100 p-4 rounded-3xl mb-4"><img id="q-img" src="" class="w-full h-auto"></div>
            <div id="q-amount" class="text-3xl font-black text-indigo-600 mb-6">Rp 0</div>
            <button onclick="confirmFinalPayment()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black">BAYAR BERHASIL</button>
            <button onclick="closeQris()" class="mt-4 text-slate-400 text-sm font-bold">BATAL</button>
        </div>
    </div>

    <div id="scanner-ui" class="hidden fixed inset-0 bg-black/98 z-[9999] flex flex-col items-center justify-center">
        <video id="scan-v" class="w-72 h-72 border-4 border-indigo-500 rounded-[40px] object-cover"></video>
        <button onclick="stopScan()" class="mt-8 bg-white text-black px-12 py-3 rounded-full font-black">BATAL</button>
    </div>

    <script>
        // --- CORE DATABASE ---
        let products = JSON.parse(localStorage.getItem('propos_ref')) || [];
        let stock_db = JSON.parse(localStorage.getItem('propos_stock')) || {};
        let sales_db = JSON.parse(localStorage.getItem('propos_sales')) || [];
        let config = JSON.parse(localStorage.getItem('propos_cfg')) || { 
            name: "TOKO BERKAH", address: "Surabaya", phone: "0812", footer: "TERIMA KASIH", logo: "", 
            phones: {shopeepay:"0812", gopay:"0812", ovo:"0812", dana:"0812"} 
        };
        let cart = [];
        let editingIndex = -1;

        const fmtRp = (n) => "Rp " + new Intl.NumberFormat('id-ID').format(n);

        function switchMenu(m) {
            document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
            document.getElementById('nav-'+m).classList.add('active');
            document.getElementById('menu-title').innerText = m;
            const v = document.getElementById('main-view');
            if(m === 'dashboard') renderDashboard(v);
            if(m === 'referensi') renderReferensi(v);
            if(m === 'barang') renderStok(v);
            if(m === 'transaksi') renderTransaksi(v);
            if(m === 'report') renderReport(v);
            if(m === 'setting') renderSetting(v);
            lucide.createIcons();
        }

        // --- MENU REFERENSI (CRUD MASTER DATA) ---
        function renderReferensi(v) {
            v.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="card-glass p-6 space-y-4 h-fit">
                        <h3 class="font-black text-indigo-400 uppercase" id="ref-title">Tambah Produk</h3>
                        <input id="r-nama" class="input-field" placeholder="Nama Produk (Contoh: HB-PB-BS)">
                        <div class="flex gap-2">
                            <input id="r-barcode" class="input-field" placeholder="Barcode">
                            <button onclick="startScan('r-barcode')" class="bg-indigo-600 px-4 rounded-xl"><i data-lucide="camera" class="w-4 h-4"></i></button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input id="r-beli" type="number" class="input-field" placeholder="Harga Beli">
                            <input id="r-jual" type="number" class="input-field" placeholder="Harga Jual">
                        </div>
                        <button onclick="saveRef()" id="btn-save-ref" class="w-full bg-indigo-600 py-4 rounded-xl font-black">SIMPAN DATA</button>
                        <button onclick="cancelEdit()" id="btn-cancel-ref" class="hidden w-full bg-slate-700 py-2 rounded-xl font-bold text-xs text-slate-400">BATAL EDIT</button>
                    </div>
                    <div class="lg:col-span-2 card-glass p-6 overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="border-b border-slate-800 text-slate-500 font-bold uppercase text-[10px]">
                                <tr><th class="p-3">NAMA PRODUK</th><th class="p-3">BARCODE</th><th class="p-3">BELI / JUAL</th><th class="p-3 text-center">AKSI</th></tr>
                            </thead>
                            <tbody id="r-body"></tbody>
                        </table>
                    </div>
                </div>`;
            loadRefTable();
        }

        function saveRef() {
            const nama = document.getElementById('r-nama').value.trim().toUpperCase();
            const bc = document.getElementById('r-barcode').value.trim();
            const beli = parseInt(document.getElementById('r-beli').value) || 0;
            const jual = parseInt(document.getElementById('r-jual').value) || 0;
            if(!nama) return alert("Nama barang wajib diisi!");

            if(editingIndex === -1) {
                // Tambah Baru
                products.push({ nama, bc_list: bc ? [bc] : [], beli, jual });
                if(!stock_db[nama]) stock_db[nama] = {awal:0, tambah:0, rusak:0, hilang:0, retur:0, terjual:0};
            } else {
                // Update (Logika perubahan harga otomatis karena data bersifat referensi)
                products[editingIndex] = { nama, bc_list: bc ? [bc] : [], beli, jual };
                editingIndex = -1;
            }
            saveData();
            renderReferensi(document.getElementById('main-view'));
        }

        function loadRefTable() {
            document.getElementById('r-body').innerHTML = products.map((p, i) => `
                <tr class="border-b border-slate-800/30">
                    <td class="p-3 font-bold">${p.nama}</td>
                    <td class="p-3 text-xs text-slate-500">${p.bc_list.join(', ')}</td>
                    <td class="p-3">${fmtRp(p.beli)} / <span class="text-indigo-400 font-bold">${fmtRp(p.jual)}</span></td>
                    <td class="p-3">
                        <div class="flex justify-center gap-3">
                            <button onclick="editRef(${i})" class="text-yellow-500 hover:scale-110 transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteRef(${i})" class="text-red-500 hover:scale-110 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        function editRef(i) {
            const p = products[i];
            editingIndex = i;
            document.getElementById('r-nama').value = p.nama;
            document.getElementById('r-barcode').value = p.bc_list[0] || "";
            document.getElementById('r-beli').value = p.beli;
            document.getElementById('r-jual').value = p.jual;
            document.getElementById('ref-title').innerText = "Edit Produk";
            document.getElementById('btn-save-ref').innerText = "UPDATE & SIMPAN";
            document.getElementById('btn-cancel-ref').classList.remove('hidden');
        }

        function cancelEdit() {
            editingIndex = -1;
            renderReferensi(document.getElementById('main-view'));
        }

        function deleteRef(i) {
            if(confirm("Hapus produk ini? Semua data stok terkait akan terpengaruh.")) {
                products.splice(i, 1);
                saveData();
                loadRefTable();
            }
        }

        // --- MENU TRANSAKSI (AUTO-DROPDOWN & MASTER PRICE) ---
        function renderTransaksi(v) {
            cart = [];
            v.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="card-glass p-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            <div class="relative">
                                <input id="t-nama-in" class="input-field" list="list-barang" placeholder="Ketik Nama Produk..." onchange="handleSelectProduct(this.value)">
                                <datalist id="list-barang">${products.map(p => `<option value="${p.nama}">`).join('')}</datalist>
                            </div>
                            <div class="flex gap-2">
                                <input id="t-scan" class="input-field" placeholder="Scan Barcode..." onchange="handleTrxScan(this.value)">
                                <button onclick="startScan('t-scan')" class="bg-indigo-600 px-4 rounded-xl"><i data-lucide="camera"></i></button>
                            </div>
                        </div>
                        <div id="t-cart" class="space-y-2 min-h-[300px]"></div>
                        <div class="pt-4 border-t border-slate-800">
                            <p class="text-[10px] text-slate-500 font-bold uppercase">Total Belanja</p>
                            <h2 id="t-total" class="text-5xl font-black text-indigo-400">Rp 0</h2>
                        </div>
                    </div>
                    <div class="card-glass p-8 space-y-4">
                        <h3 class="font-black border-b border-slate-800 pb-2">PEMBAYARAN</h3>
                        <select id="t-method" class="input-field font-bold" onchange="togglePayView()">
                            <option value="CASH">TUNAI (CASH)</option>
                            <option value="QRIS">FULL QRIS</option>
                            <option value="SPLIT">CASH & QRIS (CAMPUR)</option>
                        </select>
                        <div id="box-qris-select" class="hidden">
                            <select id="t-q-prov" class="input-field">
                                <option value="shopeepay">SHOPEEPAY</option><option value="gopay">GOPAY</option><option value="ovo">OVO</option><option value="dana">DANA</option>
                            </select>
                        </div>
                        <input id="in-cash" type="number" class="input-field text-2xl font-black text-green-400" placeholder="Input Cash" oninput="autoCalcSplit()">
                        <div id="box-qris-input" class="hidden">
                            <input id="in-qris" type="number" class="input-field text-2xl font-black text-indigo-400" placeholder="Tagihan Qris" readonly>
                        </div>
                        <div class="bg-slate-900 p-6 rounded-3xl flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-500">KEMBALI</span>
                            <span id="v-kembali" class="text-3xl font-black text-green-500">Rp 0</span>
                        </div>
                        <button onclick="handlePaymentFlow()" class="w-full bg-indigo-600 py-6 rounded-3xl font-black text-xl shadow-2xl transition hover:bg-indigo-500">PROSES BAYAR</button>
                    </div>
                </div>`;
            updateCartUI();
        }

        function handleSelectProduct(val) {
            const p = products.find(i => i.nama === val);
            if(p) {
                addToCart(p);
                document.getElementById('t-nama-in').value = "";
            }
        }

        function handleTrxScan(bc) {
            const p = products.find(i => i.bc_list.includes(bc));
            if(p) addToCart(p);
            document.getElementById('t-scan').value = "";
        }

        function addToCart(p) {
            const existing = cart.find(c => c.nama === p.nama);
            if(existing) existing.qty++;
            else cart.push({ nama: p.nama, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('t-cart');
            let grandTotal = 0;

            list.innerHTML = cart.map((item, idx) => {
                // AMBIL HARGA TERBARU DARI MASTER REFERENSI
                const master = products.find(p => p.nama === item.nama);
                const harga = master ? master.jual : 0;
                const subtotal = harga * item.qty;
                grandTotal += subtotal;

                return `
                <div class="flex justify-between items-center p-4 bg-slate-800/40 rounded-2xl">
                    <div>
                        <h4 class="font-bold text-xs uppercase">${item.nama}</h4>
                        <p class="text-xs text-indigo-400">${fmtRp(harga)} x ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${idx}, -1)" class="w-8 h-8 bg-slate-700 rounded-lg">-</button>
                        <span class="font-bold">${item.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" class="w-8 h-8 bg-slate-700 rounded-lg">+</button>
                    </div>
                </div>`;
            }).join('');

            window.currentTotal = grandTotal;
            document.getElementById('t-total').innerText = fmtRp(grandTotal);
            autoCalcSplit();
            lucide.createIcons();
        }

        function changeQty(idx, d) {
            cart[idx].qty += d;
            if(cart[idx].qty < 1) cart.splice(idx, 1);
            updateCartUI();
        }

        // --- LOGIKA BAYAR SPLIT (TETAP SAMA) ---
        function togglePayView() {
            const m = document.getElementById('t-method').value;
            document.getElementById('box-qris-select').classList.toggle('hidden', m === 'CASH');
            document.getElementById('box-qris-input').classList.toggle('hidden', m !== 'SPLIT');
            if(m === 'QRIS') document.getElementById('in-cash').value = 0;
            autoCalcSplit();
        }

        function autoCalcSplit() {
            const total = window.currentTotal || 0;
            const m = document.getElementById('t-method').value;
            const cash = parseInt(document.getElementById('in-cash').value) || 0;
            let qris = 0, kembali = 0;

            if(m === 'CASH') kembali = cash - total;
            else if(m === 'QRIS') qris = total;
            else { qris = total - cash; if(qris < 0) { qris = 0; kembali = cash - total; } }

            document.getElementById('in-qris').value = qris;
            document.getElementById('v-kembali').innerText = fmtRp(kembali > 0 ? kembali : 0);
            window.finalQris = qris; window.finalCash = cash;
        }

        function handlePaymentFlow() {
            if(cart.length === 0) return;
            const m = document.getElementById('t-method').value;
            if(m !== 'CASH') {
                document.getElementById('qris-modal').classList.remove('hidden');
                document.getElementById('q-amount').innerText = fmtRp(window.finalQris);
                document.getElementById('q-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=qris-${window.finalQris}`;
            } else { finalize(); }
        }

        function finalize() {
            // Update Stok Terjual
            cart.forEach(c => { if(stock_db[c.nama]) stock_db[c.nama].terjual += c.qty; });
            const sale = { 
                id: "INV-"+Date.now(), 
                date: new Date().toLocaleDateString('id-ID'), 
                total: window.currentTotal, 
                items: cart.map(item => {
                    const m = products.find(p => p.nama === item.nama);
                    return { ...item, jual: m.jual, beli: m.beli }; // Kunci harga saat transaksi terjadi
                }),
                method: document.getElementById('t-method').value 
            };
            sales_db.push(sale);
            saveData();
            alert("Transaksi Berhasil!");
            switchMenu('transaksi');
        }

        // --- DASHBOARD & STOK (AUTO UPDATE) ---
        function renderStok(v) {
            v.innerHTML = `
                <div class="card-glass p-6">
                    <h3 class="font-black text-indigo-400 mb-6 uppercase">Kelola Stok Barang</h3>
                    <table class="w-full text-xs text-left">
                        <thead class="text-slate-500 border-b border-slate-800 uppercase">
                            <tr><th class="p-2">PRODUK</th><th>HRG JUAL</th><th>AWAL</th><th>TAMBAH</th><th>SISA</th><th>AKSI</th></tr>
                        </thead>
                        <tbody>${products.map(p => {
                            const s = stock_db[p.nama];
                            const sisa = (s.awal + s.tambah + s.retur) - (s.rusak + s.hilang + s.terjual);
                            return `
                            <tr class="border-b border-slate-800/30">
                                <td class="p-2 font-bold">${p.nama}</td>
                                <td class="p-2 text-indigo-400">${fmtRp(p.jual)}</td>
                                <td class="p-2">${s.awal}</td><td class="p-2">${s.tambah}</td>
                                <td class="p-2 font-black text-indigo-400 text-sm">${sisa}</td>
                                <td class="p-2"><button onclick="updateStokPrompt('${p.nama}')" class="bg-indigo-600 px-3 py-1 rounded-lg">UPDATE</button></td>
                            </tr>`;
                        }).join('')}</tbody>
                    </table>
                </div>`;
        }

        function updateStokPrompt(n) {
            const qty = parseInt(prompt("Tambah Stok untuk " + n + ":", "0"));
            if(!isNaN(qty)) { stock_db[n].tambah += qty; saveData(); renderStok(document.getElementById('main-view')); }
        }

        function saveData() {
            localStorage.setItem('propos_ref', JSON.stringify(products));
            localStorage.setItem('propos_stock', JSON.stringify(stock_db));
            localStorage.setItem('propos_sales', JSON.stringify(sales_db));
        }

        function renderDashboard(v) { 
            const todaySales = sales_db.filter(s => s.date === new Date().toLocaleDateString('id-ID'));
            const omzet = todaySales.reduce((a,b) => a+b.total, 0);
            v.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="card-glass p-8 border-l-8 border-indigo-500">
                        <p class="text-xs font-bold text-slate-500 uppercase">Omzet Hari Ini</p>
                        <h2 class="text-5xl font-black">${fmtRp(omzet)}</h2>
                    </div>
                    <div class="card-glass p-8 border-l-8 border-green-500 text-center">
                        <h1 class="text-2xl font-black italic">${config.name}</h1>
                        <p class="text-xs text-slate-500">${config.address}</p>
                    </div>
                </div>
                <div class="card-glass p-6"><canvas id="dashChart"></canvas></div>`;
            new Chart(document.getElementById('dashChart'), { type:'line', data:{ labels:['S','S','R','K','J','S','M'], datasets:[{label:'Sales', data:[1,5,2,8,4,9,3], borderColor:'#6366f1'}] } });
        }

        function closeQris() { document.getElementById('qris-modal').classList.add('hidden'); }
        function confirmFinalPayment() { closeQris(); finalize(); }

        // --- SCANNER SYSTEM ---
        let scannerReader = null;
        function startScan(tid) {
            document.getElementById('scanner-ui').classList.remove('hidden');
            if(!scannerReader) scannerReader = new ZXing.BrowserMultiFormatReader();
            scannerReader.decodeFromVideoDevice(null, 'scan-v', (res) => { if(res) { document.getElementById(tid).value = res.text; const e = new Event('change'); document.getElementById(tid).dispatchEvent(e); stopScan(); } });
        }
        function stopScan() { if(scannerReader) scannerReader.reset(); document.getElementById('scanner-ui').classList.add('hidden'); }

        window.onload = () => { switchMenu('dashboard'); setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000); };
    </script>
</body>
</html>
