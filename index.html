<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Saya - Full Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <header class="bg-slate-900 p-4 border-b border-slate-800 text-center">
        <h1 class="font-bold text-indigo-400">INVENTORY SCANNER</h1>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">
        <div id="scanner-container" class="hidden relative overflow-hidden rounded-2xl bg-black aspect-video border-2 border-indigo-500">
            <video id="video" class="w-full h-full object-cover"></video>
            <div class="absolute inset-0 border-2 border-red-500 opacity-50 m-10 pointer-events-none"></div>
        </div>

        <button id="btn-scan" onclick="startScan()" class="w-full bg-indigo-600 py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
            📷 BUKA KAMERA SCAN
        </button>
        
        <button id="btn-stop" onclick="stopScan()" class="hidden w-full bg-red-600 py-4 rounded-xl font-bold shadow-lg">
            🛑 BERHENTI SCAN
        </button>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
            <p class="text-xs text-slate-500 uppercase font-bold">Hasil Barcode:</p>
            <p id="result" class="text-xl font-mono mt-1 text-green-400">Belum ada data</p>
        </div>
    </main>

    <script>
        let selectedDeviceId;
        const codeReader = new ZXing.BrowserMultiFormatReader();

        async function startScan() {
            document.getElementById('scanner-container').classList.remove('hidden');
            document.getElementById('btn-scan').classList.add('hidden');
            document.getElementById('btn-stop').classList.remove('hidden');

            codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
                if (result) {
                    document.getElementById('result').textContent = result.text;
                    // Suara bip sederhana
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    osc.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                }
            });
        }

        function stopScan() {
            codeReader.reset();
            document.getElementById('scanner-container').classList.add('hidden');
            document.getElementById('btn-scan').classList.remove('hidden');
            document.getElementById('btn-stop').classList.add('hidden');
        }
    </script>
</body>
</html>
