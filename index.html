<!doctype html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPOS Enterprise v8.1 - FIXED</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f1f5f9; overflow: hidden; }
        .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; }
        .input-field { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; color: white; width: 100%; font-weight: 600; }
        .sidebar-item { transition: 0.3s; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; color: #94a3b8; }
        .sidebar-item.active { background: #6366f1; color: white; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .badge-warning { background: #fbbf24; color: #78350f; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; }
        .badge-danger { background: #ef4444; color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; }
    </style>
</head>
<body class="h-full flex">
    <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-4">
        <div class="flex items-center gap-3 px-2 mb-6 text-white font-extrabold text-2xl italic">
            <div class="bg-indigo-500 p-2 rounded-xl"><i data-lucide="zap"></i></div> Pro<span class="text-indigo-500">POS</span>
        </div>
        <nav class="flex flex-col gap-1 overflow-y-auto">
            <div onclick="switchMenu('dashboard')" id="nav-dashboard" class="sidebar-item active"><i data-lucide="layout-dashboard"></i> Dashboard</div>
            <div onclick="switchMenu('referensi')" id="nav-referensi" class="sidebar-item"><i data-lucide="book-open"></i> Referensi Produk</div>
            <div onclick="switchMenu('stok')" id="nav-stok" class="sidebar-item"><i data-lucide="package"></i> Kelola Stok</div>
            <div onclick="switchMenu('transaksi')" id="nav-transaksi" class="sidebar-item"><i data-lucide="shopping-cart"></i> Transaksi</div>
            <div onclick="switchMenu('report')" id="nav-report" class="sidebar-item"><i data-lucide="bar-chart-3"></i> Report</div>
            <div onclick="switchMenu('setting')" id="nav-setting" class="sidebar-item"><i data-lucide="settings"></i> Setting</div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-950/50">
            <h2 id="menu-title" class="text-xl font-black uppercase text-indigo-400 italic">Dashboard</h2>
            <div id="clock" class="text-sm font-mono text-slate-400"></div>
        </header>
        <div id="main-view" class="flex-1 overflow-y-auto p-8"></div>
    </main>

    <div id="scanner-ui" class="hidden fixed inset-0 bg-black z-[9999] flex flex-col items-center justify-center">
        <video id="scan-v" class="w-72 h-72 border-4 border-indigo-500 rounded-[40px] object-cover"></video>
        <button onclick="stopScan()" class="mt-8 bg-white text-black px-12 py-3 rounded-full font-black uppercase tracking-widest">Tutup Kamera</button>
    </div>

    <div id="struk-modal" class="hidden modal-overlay overflow-y-auto p-4">
        <div class="bg-white text-black p-6 w-full max-w-[350px] font-mono text-[12px] rounded-lg">
            <div id="struk-content"></div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeStruk()" class="flex-1 bg-slate-200 py-2 rounded">Tutup</button>
                <button onclick="window.print()" class="flex-1 bg-indigo-600 text-white py-2 rounded">Cetak</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATABASE INIT ---
        let db = {
            ref: JSON.parse(localStorage.getItem('pos_ref')) || [],
            stok: JSON.parse(localStorage.getItem('pos_stok')) || {},
            sales: JSON.parse(localStorage.getItem('pos_sales')) || [],
            config: JSON.parse(localStorage.getItem('pos_cfg')) || { name: "TOKO BERKAH", addr: "Jl. Raya Surabaya", phone: "08123456", footer: "Terima Kasih" }
        };
        let cart = []; let activeScannerId = "";

        const fmtRp = (n) => "Rp " + new Intl.NumberFormat('id-ID').format(n);

        function saveData() {
            localStorage.setItem('pos_ref', JSON.stringify(db.ref));
            localStorage.setItem('pos_stok', JSON.stringify(db.stok));
            localStorage.setItem('pos_sales', JSON.stringify(db.sales));
            localStorage.setItem('pos_cfg', JSON.stringify(db.config));
        }

        function switchMenu(m) {
            document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
            const navBtn = document.getElementById('nav-'+m);
            if(navBtn) navBtn.classList.add('active');
            
            const v = document.getElementById('main-view'); 
            document.getElementById('menu-title').innerText = m;
            
            if(m === 'dashboard') renderDashboard(v);
            else if(m === 'referensi') renderReferensi(v);
            else if(m === 'stok') renderStok(v);
            else if(m === 'transaksi') renderTransaksi(v);
            else if(m === 'report') renderReport(v);
            else if(m === 'setting') renderSetting(v);
            lucide.createIcons();
        }

        // --- DASHBOARD ---
        function renderDashboard(v) {
            let total = db.sales.reduce((a,b) => a + b.total, 0);
            v.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="card-glass p-8 border-l-8 border-indigo-500">
                        <p class="text-xs font-bold text-slate-500 uppercase">Kas Masuk</p>
                        <h2 class="text-4xl font-black mt-2">${fmtRp(total)}</h2>
                    </div>
                    <div class="card-glass p-8 border-l-8 border-green-500 font-black text-2xl uppercase italic text-indigo-400">
                        ${db.config.name}
                    </div>
                </div>
                <div class="card-glass p-6 h-64"><canvas id="cDash"></canvas></div>
            `;
            new Chart(document.getElementById('cDash'), { type:'line', data:{labels:['S','S','R','K','J','S','M'], datasets:[{label:'Omzet', data:[5,10,15,7,20,25,30], borderColor:'#6366f1'}]} });
        }

        // --- REFERENSI ---
        function renderReferensi(v) {
            v.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="card-glass p-6 space-y-4 h-fit">
                        <h3 class="font-black text-indigo-400">INPUT REFERENSI</h3>
                        <input id="r-nama" class="input-field uppercase" placeholder="Nama Produk">
                        <div class="flex gap-2">
                            <input id="r-bc" class="input-field" placeholder="Barcode">
                            <button onclick="startScan('r-bc')" class="bg-indigo-600 px-4 rounded-xl"><i data-lucide="camera"></i></button>
                        </div>
                        <input id="r-beli" type="number" class="input-field" placeholder="Harga Beli">
                        <input id="r-jual" type="number" class="input-field" placeholder="Harga Jual">
                        <button onclick="saveRef()" class="w-full bg-indigo-600 py-4 rounded-xl font-black">SIMPAN</button>
                    </div>
                    <div class="lg:col-span-2 card-glass p-6">
                        <table class="w-full text-xs text-left">
                            <thead><tr class="text-slate-500 border-b border-slate-800"><th>NAMA</th><th>JUAL</th><th>AKSI</th></tr></thead>
                            <tbody id="r-body">${db.ref.map((p,i) => `<tr class="border-b border-slate-800/30"><td class="p-3 font-bold">${p.nama}</td><td>${fmtRp(p.jual)}</td><td><button onclick="deleteRef(${i})" class="text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
        function saveRef() {
            const n = document.getElementById('r-nama').value.toUpperCase();
            const bc = document.getElementById('r-bc').value;
            const b = parseInt(document.getElementById('r-beli').value) || 0;
            const j = parseInt(document.getElementById('r-jual').value) || 0;
            if(!n) return;
            db.ref.push({nama:n, bc:bc, beli:b, jual:j});
            if(!db.stok[n]) db.stok[n] = { awal:0, masuk:0, rusak:0, hilang:0, laku:0, bc_list:[bc] };
            saveData(); renderReferensi(document.getElementById('main-view'));
        }
        function deleteRef(i) { if(confirm('Hapus item ini?')){ db.ref.splice(i,1); saveData(); switchMenu('referensi'); } }

        // --- STOK ---
        function renderStok(v) {
            v.innerHTML = `
                <div class="card-glass p-6">
                    <div class="flex justify-between mb-4">
                        <h3 class="font-black italic">KELOLA STOK</h3>
                        <input id="s-scan" class="input-field w-64 text-xs" placeholder="Scan Barcode Stok..." onchange="handleStokScan(this.value)">
                    </div>
                    <table class="w-full text-[11px] text-left">
                        <thead><tr class="text-slate-500 border-b border-slate-800"><th>PRODUK</th><th>AWAL</th><th>MASUK</th><th>SISA</th><th>AKSI</th></tr></thead>
                        <tbody>${db.ref.map(p => {
                            const s = db.stok[p.nama];
                            const sisa = (s.awal + s.masuk) - (s.rusak + s.hilang + s.laku);
                            const warn = sisa <= 0 ? '<span class="badge-danger">HABIS</span>' : (sisa <= 10 ? '<span class="badge-warning">LOW</span>' : '');
                            return `<tr class="border-b border-slate-800/30"><td class="p-2 font-bold">${p.nama}<br>${warn}</td><td>${s.awal}</td><td>${s.masuk}</td><td class="text-indigo-400 font-black">${sisa}</td><td><button onclick="addStokManual('${p.nama}')" class="bg-indigo-600 px-2 py-1 rounded">Update</button></td></tr>`;
                        }).join('')}</tbody>
                    </table>
                </div>
            `;
        }
        function addStokManual(n) { const q = prompt("Tambah Stok Masuk untuk "+n, "0"); if(q){ db.stok[n].masuk += parseInt(q); saveData(); renderStok(document.getElementById('main-view')); } }
        function handleStokScan(bc) {
            const p = db.ref.find(x => x.bc === bc || (db.stok[x.nama] && db.stok[x.nama].bc_list.includes(bc)));
            if(p) { db.stok[p.nama].masuk += 1; saveData(); renderStok(document.getElementById('main-view')); alert("Berhasil tambah stok: "+p.nama); }
            document.getElementById('s-scan').value = "";
        }

        // --- TRANSAKSI ---
        function renderTransaksi(v) {
            cart = [];
            v.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 h-full">
                    <div class="card-glass p-6 space-y-4">
                        <div class="flex gap-2">
                            <input id="t-scan" class="input-field font-bold" placeholder="Barcode / Pilih..." list="l-p" onchange="handleTScan(this.value)">
                            <datalist id="l-p">${db.ref.map(p=>`<option value="${p.nama}">`).join('')}</datalist>
                            <button onclick="startScan('t-scan')" class="bg-indigo-600 px-4 rounded-xl"><i data-lucide="camera"></i></button>
                        </div>
                        <div id="cart-box" class="space-y-2 min-h-[300px]"></div>
                        <div class="text-right"><p class="text-xs text-slate-500">TOTAL</p><h2 id="v-tot" class="text-5xl font-black text-indigo-400">Rp 0</h2></div>
                    </div>
                    <div class="card-glass p-6 space-y-4">
                        <select id="m-pay" class="input-field" onchange="calcTrx()">
                            <option value="CASH">CASH</option><option value="SPLIT">SPLIT (CASH + QRIS)</option>
                        </select>
                        <input id="i-cash" type="number" class="input-field text-2xl text-green-400" placeholder="Tunai" oninput="calcTrx()">
                        <div id="q-area" class="hidden">
                            <input id="i-qris" class="input-field text-xl text-indigo-400" readonly>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-xl flex justify-between"><span>KEMBALI</span><span id="v-kem" class="text-2xl font-black">Rp 0</span></div>
                        <button onclick="finalTrx()" class="w-full bg-indigo-600 py-6 rounded-3xl font-black text-xl">SIMPAN & CETAK</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
        function handleTScan(v) {
            const p = db.ref.find(x => x.nama === v.toUpperCase() || x.bc === v);
            if(p) {
                const sisa = (db.stok[p.nama].awal + db.stok[p.nama].masuk) - (db.stok[p.nama].rusak + db.stok[p.nama].hilang + db.stok[p.nama].laku);
                if(sisa <= 0) return alert("Stok Habis!");
                const ex = cart.find(c => c.nama === p.nama);
                if(ex) ex.qty++; else cart.push({nama:p.nama, qty:1, harga:p.jual});
                updateCUI();
            }
            document.getElementById('t-scan').value = "";
        }
        function updateCUI() {
            let t = 0;
            document.getElementById('cart-box').innerHTML = cart.map((item, i) => {
                t += (item.harga * item.qty);
                return `
                    <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
                        <span class="font-bold text-sm uppercase">${item.nama}</span>
                        <div class="flex items-center gap-3">
                            <button onclick="changeQty(${i},-1)" class="w-8 h-8 bg-slate-700 rounded-lg">-</button>
                            <span class="font-bold">${item.qty}</span>
                            <button onclick="changeQty(${i},1)" class="w-8 h-8 bg-slate-700 rounded-lg">+</button>
                            <button onclick="cart.splice(${i},1);updateCUI();" class="ml-2 text-red-500"><i data-lucide="x-circle"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
            window.totTrx = t; document.getElementById('v-tot').innerText = fmtRp(t);
            calcTrx(); lucide.createIcons();
        }
        function changeQty(i, n) { 
            cart[i].qty += n; 
            if(cart[i].qty <= 0) cart.splice(i,1); 
            updateCUI(); 
        }
        function calcTrx() {
            const m = document.getElementById('m-pay').value;
            const cash = parseInt(document.getElementById('i-cash').value) || 0;
            const t = window.totTrx || 0;
            document.getElementById('q-area').classList.toggle('hidden', m==='CASH');
            let q = 0, k = 0;
            if(m === 'CASH') k = cash - t; else { q = t - cash; if(q < 0){ q=0; k=cash-t; } }
            document.getElementById('i-qris').value = "Tagihan QRIS: " + fmtRp(q);
            document.getElementById('v-kem').innerText = fmtRp(k > 0 ? k : 0);
            window.finalQ = q; window.finalK = k;
        }
        function finalTrx() {
            if(cart.length === 0) return;
            cart.forEach(c => { db.stok[c.nama].laku += c.qty; });
            const s = { id:"INV"+Date.now(), total:window.totTrx, tgl:new Date().toLocaleDateString(), items:[...cart] };
            db.sales.push(s); saveData(); alert("Transaksi Berhasil!"); switchMenu('transaksi');
        }

        // --- LAINNYA ---
        function renderReport(v) { v.innerHTML = `<div class="card-glass p-6"><table class="w-full text-xs"><thead><tr class="border-b border-slate-800"><th>ID</th><th>TOTAL</th></tr></thead><tbody>${db.sales.slice().reverse().map(s => `<tr><td class="p-3">${s.id}</td><td class="font-bold">${fmtRp(s.total)}</td></tr>`).join('')}</tbody></table></div>`; }
        function renderSetting(v) { v.innerHTML = `<div class="card-glass p-8 max-w-md mx-auto space-y-4"><h3>SETTING TOKO</h3><input id="c-n" class="input-field" value="${db.config.name}"><button onclick="db.config.name=document.getElementById('c-n').value;saveData();location.reload()" class="w-full bg-indigo-600 py-3 rounded-xl font-bold">SIMPAN</button></div>`; }
        
        let scanner = null;
        function startScan(tid) {
            activeScannerId = tid; document.getElementById('scanner-ui').classList.remove('hidden');
            if(!scanner) scanner = new ZXing.BrowserMultiFormatReader();
            scanner.decodeFromVideoDevice(null, 'scan-v', (res) => { if(res){ document.getElementById(activeScannerId).value=res.text; document.getElementById(activeScannerId).dispatchEvent(new Event('change')); stopScan(); } });
        }
        function stopScan() { if(scanner) scanner.reset(); document.getElementById('scanner-ui').classList.add('hidden'); }
        window.onload = () => { switchMenu('dashboard'); setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000); };
    </script>
</body>
</html>
