<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Pro - POS Mandiri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Sidebar */
        .sidebar { width: 250px; position: fixed; height: 100vh; background: var(--primary); color: white; transition: 0.3s; z-index: 100; }
        .sidebar a { color: #bdc3c7; text-decoration: none; padding: 15px 20px; display: block; border-bottom: 1px solid #34495e; }
        .sidebar a:hover, .sidebar a.active { background: #34495e; color: white; border-left: 5px solid var(--accent); }
        
        .main-content { margin-left: 250px; padding: 20px; transition: 0.3s; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-radius: 12px; }
        .hidden { display: none; }
        
        /* POS Style */
        #cart-list { max-height: 400px; overflow-y: auto; }
        .total-display { font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        
        @media (max-width: 768px) {
            .sidebar { margin-left: -250px; }
            .main-content { margin-left: 0; }
            .sidebar.active { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="p-4 text-center">
            <div id="displayLogo" class="bg-light rounded-circle mx-auto mb-2" style="width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; color: #333;">LOGO</div>
            <h5 id="displayNamaToko">Toko Saya</h5>
        </div>
        <nav>
            <a href="#" onclick="showPage('transaksi')" class="nav-link-item active">🛒 Transaksi</a>
            <a href="#" onclick="showPage('produk')" class="nav-link-item">📦 Kelola Produk</a>
            <a href="#" onclick="showPage('stok')" class="nav-link-item">📉 Stok Opname</a>
            <a href="#" onclick="showPage('setting')" class="nav-link-item">⚙️ Pengaturan</a>
        </nav>
    </div>

    <div class="main-content">
        
        <div id="page-transaksi" class="page-section">
            <h3 class="mb-4">Kasir / Penjualan</h3>
            <div class="row">
                <div class="col-md-8">
                    <div class="card p-3 mb-3">
                        <div class="input-group mb-3">
                            <span class="input-group-text bg-primary text-white">🔍 SCAN</span>
                            <input type="text" id="scanInput" class="form-control form-control-lg" placeholder="Scan Barcode atau ketik kode barang...">
                        </div>
                        <div id="cart-list">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Produk</th><th>Harga</th><th width="120">Qty</th><th>Subtotal</th><th></th>
                                    </tr>
                                </thead>
                                <tbody id="cartTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card p-4 text-end mb-3">
                        <span class="text-muted small">Grand Total</span>
                        <div class="total-display" id="grandTotalText">Rp 0</div>
                    </div>

                    <div class="card p-3">
                        <label class="fw-bold mb-2">Pembayaran</label>
                        <select id="payMethod" class="form-select mb-3" onchange="togglePayUI()">
                            <option value="CASH">Tunai (Cash)</option>
                            <option value="QRIS">QRIS (Full)</option>
                            <option value="SPLIT">Split (Cash + QRIS)</option>
                        </select>

                        <div id="uiCash">
                            <label class="small text-muted">Uang Tunai</label>
                            <input type="number" id="inputTunai" class="form-control mb-3" oninput="calculatePayment()">
                        </div>

                        <div id="uiQris" class="hidden">
                            <label class="small text-muted">E-Wallet</label>
                            <select id="qrisProvider" class="form-select mb-2">
                                <option>DANA</option><option>OVO</option><option>GoPay</option><option>ShopeePay</option>
                            </select>
                            <input type="number" id="inputQris" class="form-control mb-3" readonly>
                        </div>

                        <div class="d-flex justify-content-between border-top pt-3">
                            <span class="fw-bold">Kembali:</span>
                            <span id="textKembalian" class="fw-bold text-success">Rp 0</span>
                        </div>
                        <button class="btn btn-primary w-100 py-3 mt-3 shadow fw-bold" onclick="finishTransaction()">SIMPAN & CETAK</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-produk" class="page-section hidden">
            <h3>Daftar Referensi Produk</h3>
            <div class="card p-3">
                <div class="row g-2 mb-3">
                    <div class="col-md-3"><input type="text" id="pBarcode" class="form-control" placeholder="Barcode"></div>
                    <div class="col-md-3"><input type="text" id="pNama" class="form-control" placeholder="Nama Produk"></div>
                    <div class="col-md-2"><input type="number" id="pBeli" class="form-control" placeholder="Harga Beli"></div>
                    <div class="col-md-2"><input type="number" id="pJual" class="form-control" placeholder="Harga Jual"></div>
                    <div class="col-md-2"><button class="btn btn-success w-100" onclick="saveNewProduct()">Tambah</button></div>
                </div>
                <table class="table table-bordered">
                    <thead><tr><th>Barcode</th><th>Nama</th><th>Beli</th><th>Jual</th><th>Aksi</th></tr></thead>
                    <tbody id="productTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // DATA STORAGE (Simulasi Database)
        let dbProduk = JSON.parse(localStorage.getItem('pos_produk')) || [];
        let keranjang = [];
        let grandTotal = 0;

        // 1. Inisialisasi Halaman
        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + pageId).classList.remove('hidden');
            
            document.querySelectorAll('.nav-link-item').forEach(a => a.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if(pageId === 'produk') renderProductTable();
        }

        // 2. Transaksi: Scan Barcode
        document.getElementById('scanInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                let code = this.value;
                let found = dbProduk.find(p => p.barcode === code);
                
                if (found) {
                    addToCart(found);
                } else {
                    alert("Produk tidak ditemukan! Daftarkan dulu di menu Kelola Produk.");
                }
                this.value = '';
            }
        });

        function addToCart(item) {
            let exist = keranjang.find(i => i.nama === item.nama);
            if (exist) {
                exist.qty++;
                exist.total = exist.qty * exist.jual;
            } else {
                keranjang.push({ ...item, qty: 1, total: parseInt(item.jual) });
            }
            renderCart();
        }

        function renderCart() {
            let html = '';
            grandTotal = 0;
            keranjang.forEach((item, index) => {
                grandTotal += item.total;
                html += `<tr>
                    <td>${item.nama}</td>
                    <td>Rp ${parseInt(item.jual).toLocaleString()}</td>
                    <td>
                        <div class="input-group input-group-sm">
                            <button class="btn btn-outline-secondary" onclick="updateQty(${index}, -1)">-</button>
                            <input type="text" class="form-control text-center" value="${item.qty}" readonly>
                            <button class="btn btn-outline-secondary" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </td>
                    <td>Rp ${item.total.toLocaleString()}</td>
                    <td class="text-danger" style="cursor:pointer" onclick="removeItem(${index})">✕</td>
                </tr>`;
            });
            document.getElementById('cartTableBody').innerHTML = html;
            document.getElementById('grandTotalText').innerText = "Rp " + grandTotal.toLocaleString();
            calculatePayment();
        }

        // 3. Pembayaran Logic
        function togglePayUI() {
            let m = document.getElementById('payMethod').value;
            document.getElementById('uiCash').className = (m === 'QRIS' ? 'hidden' : '');
            document.getElementById('uiQris').className = (m === 'CASH' ? 'hidden' : '');
            calculatePayment();
        }

        function calculatePayment() {
            let method = document.getElementById('payMethod').value;
            let tunai = parseFloat(document.getElementById('inputTunai').value) || 0;
            let qrisInput = document.getElementById('inputQris');
            let kembalianText = document.getElementById('textKembalian');

            if (method === 'SPLIT') {
                let sisa = grandTotal - tunai;
                qrisInput.value = sisa > 0 ? sisa : 0;
                let lebih = tunai - grandTotal;
                kembalianText.innerText = "Rp " + (lebih > 0 ? lebih.toLocaleString() : 0);
            } else if (method === 'CASH') {
                let kembalian = tunai - grandTotal;
                kembalianText.innerText = "Rp " + (kembalian > 0 ? kembalian.toLocaleString() : 0);
            } else {
                qrisInput.value = grandTotal;
                kembalianText.innerText = "Rp 0";
            }
        }

        // 4. Manajemen Produk (Database Lokal)
        function saveNewProduct() {
            let bar = document.getElementById('pBarcode').value;
            let nam = document.getElementById('pNama').value;
            let bel = document.getElementById('pBeli').value;
            let jua = document.getElementById('pJual').value;

            if(!bar || !nam) return alert("Isi Barcode dan Nama!");
            
            dbProduk.push({ barcode: bar, nama: nam, beli: bel, jual: jua });
            localStorage.setItem('pos_produk', JSON.stringify(dbProduk));
            
            alert("Produk Tersimpan!");
            document.getElementById('pBarcode').value = '';
            document.getElementById('pNama').value = '';
            renderProductTable();
        }

        function renderProductTable() {
            let h = '';
            dbProduk.forEach((p, index) => {
                h += `<tr>
                    <td>${p.barcode}</td><td>${p.nama}</td>
                    <td>${p.beli}</td><td>${p.jual}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="delProd(${index})">Hapus</button></td>
                </tr>`;
            });
            document.getElementById('productTableBody').innerHTML = h;
        }

        function delProd(i) {
            dbProduk.splice(i, 1);
            localStorage.setItem('pos_produk', JSON.stringify(dbProduk));
            renderProductTable();
        }

        function updateQty(i, n) {
            if(keranjang[i].qty + n > 0) {
                keranjang[i].qty += n;
                keranjang[i].total = keranjang[i].qty * keranjang[i].jual;
                renderCart();
            }
        }

        function removeItem(i) { keranjang.splice(i,1); renderCart(); }

        function finishTransaction() {
            if(keranjang.length === 0) return alert("Keranjang kosong!");
            alert("Transaksi Berhasil!\nTotal: Rp " + grandTotal.toLocaleString());
            keranjang = [];
            document.getElementById('inputTunai').value = '';
            renderCart();
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
