<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPOS Custom v1.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f1f5f9; overflow: hidden; }
        .sidebar-item { transition: 0.2s; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #94a3b8; font-size: 13px; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar-item.active { background: #6366f1; color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .stat-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen w-screen">

    <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-6">
        <div class="flex items-center gap-3 pb-6 border-b border-slate-800">
            <div class="w-12 h-12 rounded-xl overflow-hidden border border-slate-700 bg-slate-800 flex-shrink-0">
                <img id="logo-toko-img" src="https://via.placeholder.com/48" class="w-full h-full object-cover">
            </div>
            <div class="overflow-hidden">
                <div class="text-xl font-black italic text-indigo-500 leading-none">Pro <span class="text-white">POS</span></div>
                <h2 id="nama-toko-side" class="font-bold text-[10px] text-slate-500 mt-1 truncate uppercase tracking-widest">MY STORE</h2>
            </div>
        </div>
        
        <nav class="flex flex-col gap-1 flex-1 overflow-y-auto">
            <div onclick="gantiMenu('dashboard')" id="m-dashboard" class="sidebar-item active"><i data-lucide="layout-dashboard" class="w-4"></i> Dashboard</div>
            <div onclick="gantiMenu('referensi')" id="m-referensi" class="sidebar-item"><i data-lucide="package" class="w-4"></i> Referensi Produk</div>
            <div onclick="gantiMenu('stok')" id="m-stok" class="sidebar-item"><i data-lucide="boxes" class="w-4"></i> Kelola Stok</div>
            <div onclick="gantiMenu('transaksi')" id="m-transaksi" class="sidebar-item"><i data-lucide="shopping-cart" class="w-4"></i> Transaksi</div>
        </nav>
    </aside>
    
    <main class="flex-1 flex flex-col overflow-hidden bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
        <header class="h-16 border-b border-slate-800 flex items-center justify-between px-8">
            <h2 id="judul-halaman" class="font-black uppercase tracking-tighter text-indigo-400 text-sm">Dashboard</h2>
            <div id="jam" class="text-[10px] font-mono text-slate-500 bg-slate-900 px-3 py-1 rounded-full border border-slate-800"></div>
        </header>

        <div id="konten-utama" class="flex-1 overflow-y-auto p-8"></div>
    </main>

    <script>
        // --- DATABASE & SETUP ---
        let db_ref = JSON.parse(localStorage.getItem('db_ref')) || [];
        const fmtRp = (n) => "Rp " + new Intl.NumberFormat('id-ID').format(n || 0);

        // --- NAVIGATION ---
        function gantiMenu(menu) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            const elMenu = document.getElementById('m-' + menu);
            if(elMenu) elMenu.classList.add('active');
            
            document.getElementById('judul-halaman').innerText = menu.toUpperCase();
            const target = document.getElementById('konten-utama');

            if (menu === 'dashboard') renderDashboard(target);
            else if (menu === 'referensi') renderReferensi(target);
            else target.innerHTML = `<div class="h-full flex items-center justify-center opacity-10 font-black text-4xl italic">MENU ${menu.toUpperCase()} SEGERA HADIR</div>`;
            
            lucide.createIcons();
        }

        // --- DASHBOARD ---
        function renderDashboard(div) {
            div.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="stat-card border-l-4 border-indigo-500">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">Total Profit</p>
                        <h2 class="text-3xl font-black mt-1">Rp 0</h2>
                    </div>
                    <div class="stat-card border-l-4 border-pink-500">
                        <p class="text-[10px] font-bold text-slate-500 uppercase">Total Produk</p>
                        <h2 class="text-3xl font-black mt-1">${db_ref.length}</h2>
                    </div>
                </div>
                <div class="stat-card h-64"><canvas id="chartUtama"></canvas></div>
            `;
            const ctx = document.getElementById('chartUtama');
            if(ctx) new Chart(ctx, { type: 'line', data: { labels: ['H-6','H-5','H-4','H-3','H-2','H-1','NOW'], datasets: [{ label: 'Sales', data: [0,0,0,0,0,0,0], borderColor: '#6366f1', tension: 0.4 }] }, options: { maintainAspectRatio: false } });
        }

        // --- REFERENSI & SCANNER ---
        function renderReferensi(div) {
            div.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="stat-card h-fit border-t-4 border-indigo-500">
                        <h3 class="text-xs font-black text-indigo-400 uppercase mb-6 italic">Input Data Produk</h3>
                        <div class="space-y-4">
                            <input id="ref-nama" placeholder="NAMA BARANG" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm w-full outline-none focus:ring-2 ring-indigo-500 uppercase text-white">
                            <div class="flex gap-2">
                                <input id="ref-bc" placeholder="BARCODE" class="bg
    <aside>
        <h2 style="color: #6366f1; margin-bottom: 30px;">Pro<span style="color:white">POS</span></h2>
        <div onclick="gantiMenu('dashboard')" id="m-dashboard" class="menu-item active">Dashboard</div>
        <div onclick="gantiMenu('referensi')" id="m-referensi" class="menu-item">Referensi Produk</div>
        <div onclick="alert('Menu dalam pengembangan')" class="menu-item">Kelola Stok</div>
        <div onclick="alert('Menu dalam pengembangan')" class="menu-item">Transaksi</div>
    </aside>

    <main>
        <header>
            <h3 id="judul-halaman">DASHBOARD</h3>
            <div id="jam" style="font-size: 12px; color: #94a3b8;"></div>
        </header>
        <div id="konten-utama"></div>
    </main>

    <script>
        // Data Global
        let db_ref = JSON.parse(localStorage.getItem('db_ref_pos')) || [];

        // Fungsi Ganti Halaman
        function gantiMenu(menu) {
            // Update UI Menu
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById('m-' + menu).classList.add('active');
            document.getElementById('judul-halaman').innerText = menu.toUpperCase();

            const target = document.getElementById('konten-utama');
            if (menu === 'dashboard') renderDashboard(target);
            if (menu === 'referensi') renderReferensi(target);
        }

        // Render Dashboard
        function renderDashboard(target) {
            target.innerHTML = `
                <div class="stat-card">
                    <h3>Selamat Datang di ProPOS</h3>
                    <p style="color: #94a3b8; margin-top: 10px;">Total Produk Terdaftar: <b>${db_ref.length} Barang</b></p>
                </div>
            `;
        }

        // Render Referensi
        function renderReferensi(target) {
            target.innerHTML = `
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div class="stat-card" style="flex: 1; min-width: 300px;">
                        <h3>Tambah Produk</h3>
                        <div style="margin-top: 15px;">
                            <input type="text" id="nama" placeholder="Nama Barang (Wajib)">
                            <input type="text" id="barcode" placeholder="Barcode (Opsional)">
                            <input type="number" id="beli" placeholder="Harga Beli">
                            <input type="number" id="jual" placeholder="Harga Jual (Wajib)">
                            <button onclick="simpanBarang()">SIMPAN BARANG</button>
                        </div>
                    </div>
                    <div class="stat-card" style="flex: 2; min-width: 400px;">
                        <h3>Daftar Barang</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Produk</th>
                                    <th>Beli</th>
                                    <th>Jual</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-barang"></tbody>
                        </table>
                    </div>
                </div>
            `;
            tampilkanTabel();
        }

        // Logika Simpan Data
        function simpanBarang() {
            const nama = document.getElementById('nama').value;
            const bc = document.getElementById('barcode').value;
            const beli = document.getElementById('beli').value || 0;
            const jual = document.getElementById('jual').value;

            if (!nama || !jual) {
                alert("Nama dan Harga Jual tidak boleh kosong!");
                return;
            }

            db_ref.push({ nama, bc, beli, jual });
            localStorage.setItem('db_ref_pos', JSON.stringify(db_ref));
            
            alert("Barang berhasil disimpan!");
            renderReferensi(document.getElementById('konten-utama')); // Refresh halaman
        }

        // Tampilkan Tabel
        function tampilkanTabel() {
            const tbody = document.getElementById('tabel-barang');
            if (!tbody) return;
            
            if (db_ref.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#555">Belum ada data</td></tr>';
                return;
            }

            tbody.innerHTML = db_ref.map((item, index) => `
                <tr>
                    <td><b>${item.nama}</b><br><small style="color:#666">${item.bc || '-'}</small></td>
                    <td>Rp ${item.beli}</td>
                    <td>Rp ${item.jual}</td>
                    <td><button class="btn-hapus" onclick="hapusBarang(${index})">Hapus</button></td>
                </tr>
            `).join('');
        }

        function hapusBarang(index) {
            if (confirm("Hapus barang ini?")) {
                db_ref.splice(index, 1);
                localStorage.setItem('db_ref_pos', JSON.stringify(db_ref));
                renderReferensi(document.getElementById('konten-utama'));
            }
        }

        // Jam & Start
        setInterval(() => {
            const jamEl = document.getElementById('jam');
            if(jamEl) jamEl.innerText = new Date().toLocaleString('id-ID');
        }, 1000);

        window.onload = () => gantiMenu('dashboard');
    </script>
</body>
</html>
