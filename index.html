<!doctype html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory POS Manager</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
    <script src="/_sdk/element_sdk.js"></script>
    <script src="/_sdk/data_sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .app-shell { height: 100%; width: 100%; display: flex; overflow: hidden; }
        .sidebar-nav { width: 260px; min-width: 260px; height: 100%; overflow-y: auto; }
        .main-panel { flex: 1; height: 100%; overflow-y: auto; }
        .sidebar-nav::-webkit-scrollbar, .main-panel::-webkit-scrollbar { width: 4px; }
        .sidebar-nav::-webkit-scrollbar-thumb, .main-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        /* TOAST & ANIMATION */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 14px; animation: slideIn 0.3s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .toast-success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .toast-warn { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .toast-info { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* UI COMPONENTS */
        .card-glass { background: rgba(30,41,59,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(71,85,105,0.4); border-radius: 16px; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-weight: 600; border-radius: 10px; padding: 8px 18px; transition: all 0.2s; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; font-weight: 600; border-radius: 10px; padding: 8px 18px; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-weight: 600; border-radius: 10px; padding: 8px 18px; }
        .input-field { background: rgba(15,23,42,0.6); border: 1px solid rgba(71,85,105,0.5); border-radius: 10px; padding: 10px 14px; color: #e2e8f0; font-size: 14px; width: 100%; }
        
        /* SCANNER NEW STYLE */
        .scanner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9997; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .scanner-box { position: absolute; width: 280px; height: 180px; border: 3px solid #6366f1; border-radius: 16px; box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.6); z-index: 10; display: flex; align-items: center; justify-content: center; }
        .scanner-line { position: absolute; width: 90%; height: 2px; background: #ef4444; box-shadow: 0 0 8px 1px #ef4444; animation: scanAnim 2s infinite ease-in-out; }
        @keyframes scanAnim { 0% { top: 5%; } 50% { top: 95%; } 100% { top: 5%; } }

        .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9998; display: flex; align-items: center; justify-content: center; }
        .confirm-box { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; }
        
        @media (max-width: 768px) {
            .sidebar-nav { position: fixed; left: -280px; top: 0; z-index: 50; transition: left 0.3s ease; }
            .sidebar-nav.open { left: 0; }
            .sidebar-overlay.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
        }
    </style>
</head>
<body class="h-full bg-slate-950 font-sans text-slate-200">
    <div id="toast-container" class="toast-container"></div>
    <div id="confirm-container"></div>

    <div class="app-shell">
        <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
        
        <nav id="sidebar" class="sidebar-nav bg-slate-900 border-r border-slate-800 flex flex-col">
            <div class="p-5 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                        <i data-lucide="store" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 id="store-name" class="font-bold text-white text-lg leading-tight">Toko Saya</h1>
                        <p class="text-xs text-slate-500">POS & Inventory</p>
                    </div>
                </div>
            </div>
            <div class="flex-1 p-3 space-y-1">
                <button onclick="navigateTo('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </button>
                <button onclick="navigateTo('barang')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800">
                    <i data-lucide="package" class="w-5 h-5"></i> Kelola Barang
                </button>
                <button onclick="navigateTo('transaksi')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i> Transaksi
                </button>
                <button onclick="navigateTo('report')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Report
                </button>
            </div>
        </nav>

        <div class="main-panel">
            <header class="sticky top-0 z-30 bg-slate-950/80 backdrop-blur-lg border-b border-slate-800 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button class="p-2 rounded-lg bg-slate-800 md:hidden" onclick="toggleSidebar()"><i data-lucide="menu" class="w-5 h-5"></i></button>
                    <h2 id="page-title" class="text-lg font-bold text-white">Dashboard</h2>
                </div>
                <div id="clock" class="text-xs font-mono text-slate-500"></div>
            </header>
            <div id="page-content" class="p-4 md:p-6"></div>
        </div>
    </div>

    <script>
        // --- GLOBALS ---
        let allData = [];
        let currentPage = 'dashboard';
        let cartItems = [];
        let scannerStream = null;
        let scannerActive = false;
        let scannerReader = null;

        const defaultConfig = { app_title: 'Toko Saya', footer_text: 'Terima kasih!' };

        // --- UTILS ---
        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function fmtRp(n) { return 'Rp ' + new Intl.NumberFormat('id-ID').format(n || 0); }

        function playBeep() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                const osc = context.createOscillator();
                const gain = context.createGain();
                osc.type = "sine"; osc.frequency.setValueAtTime(800, context.currentTime);
                gain.gain.setValueAtTime(0.1, context.currentTime);
                osc.connect(gain); gain.connect(context.destination);
                osc.start(); osc.stop(context.currentTime + 0.1);
            } catch(e) {}
        }

        // --- SCANNER LOGIC ---
        function openScanner(callback) {
            const c = document.getElementById('confirm-container');
            c.innerHTML = `
            <div class="scanner-overlay" onclick="closeScannerOverlay()">
                <div class="relative w-full h-full flex items-center justify-center" onclick="event.stopPropagation()">
                    <div class="scanner-box"><div class="scanner-line"></div></div>
                    <video id="video-scanner" class="w-full h-full object-cover" playsinline autoplay muted></video>
                    <div id="scanner-status" class="absolute top-10 bg-black/50 p-2 rounded text-xs text-white">Menghubungkan...</div>
                    <div class="absolute bottom-10 flex gap-4">
                         <button class="btn-primary" onclick="toggleFlash()">💡 Flash</button>
                         <button class="btn-danger" onclick="closeScannerOverlay()">Tutup</button>
                    </div>
                </div>
            </div>`;
            window.currentScanCallback = callback;
            startBarcodeScan();
        }

        function startBarcodeScan() {
            const video = document.getElementById('video-scanner');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                scannerStream = stream;
                video.srcObject = stream;
                video.play();
                scannerActive = true;
                continuousScan(video);
            }).catch(() => showToast('Gagal akses kamera', 'error'));
        }

        function continuousScan(video) {
            if (!scannerActive) return;
            const canvas = document.createElement('canvas');
            canvas.width = 640; canvas.height = 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (!scannerReader) scannerReader = new ZXing.BrowserMultiFormatReader();
            scannerReader.decodeFromCanvas(canvas)
            .then(result => {
                if (result && scannerActive) {
                    playBeep();
                    scannerActive = false;
                    closeScannerOverlay();
                    if (window.currentScanCallback) window.currentScanCallback(result.getText());
                }
            })
            .catch(() => { if (scannerActive) requestAnimationFrame(() => continuousScan(video)); });
        }

        function closeScannerOverlay() {
            scannerActive = false;
            if (scannerStream) scannerStream.getTracks().forEach(t => t.stop());
            document.getElementById('confirm-container').innerHTML = '';
        }

        function toggleFlash() {
            const track = scannerStream?.getVideoTracks()[0];
            if (track) {
                const s = track.getSettings();
                track.applyConstraints({ advanced: [{ torch: !s.torch }] });
            }
        }

        // --- NAVIGATION & PAGES ---
        function navigateTo(page) {
            currentPage = page;
            renderPage();
        }

        function renderPage() {
            const c = document.getElementById('page-content');
            document.getElementById('page-title').textContent = currentPage.toUpperCase();
            if (currentPage === 'dashboard') renderDashboard(c);
            else if (currentPage === 'barang') renderBarang(c);
            else if (currentPage === 'transaksi') renderTransaksi(c);
            lucide.createIcons();
        }

        function renderDashboard(c) {
            c.innerHTML = `<div class="card-glass p-6"><h3>Selamat Datang di POS System</h3><p class="text-slate-400 mt-2">Pilih menu di samping untuk memulai.</p></div>`;
        }

        function renderBarang(c) {
            const list = allData.filter(d => d.type === 'barang');
            c.innerHTML = `
            <div class="space-y-4">
                <button class="btn-primary" onclick="showBarangForm()">+ Tambah Barang</button>
                <div id="barang-form"></div>
                <div class="card-glass overflow-hidden">
                    <table class="w-full text-sm">
                        <tr class="bg-slate-800 text-slate-400"><th class="p-3 text-left">Nama</th><th class="p-3 text-right">Harga</th><th class="p-3 text-center">Aksi</th></tr>
                        ${list.map(b => `<tr class="border-t border-slate-800"><td class="p-3 font-bold">${b.name}</td><td class="p-3 text-right">${fmtRp(b.harga_jual)}</td><td class="p-3 text-center"><button class="text-red-400" onclick="deleteData('${b.__backendId}')">Hapus</button></td></tr>`).join('')}
                    </table>
                </div>
            </div>`;
        }

        function showBarangForm() {
            const f = document.getElementById('barang-form');
            f.innerHTML = `
            <div class="card-glass p-4 grid gap-3">
                <div class="flex gap-2">
                    <input id="bf-name" class="input-field" placeholder="Nama Barang">
                    <button class="btn-primary" onclick="openScanner(v => document.getElementById('bf-barcode').value = v)">Scan</button>
                </div>
                <input id="bf-barcode" class="input-field" placeholder="Barcode">
                <input id="bf-harga" type="number" class="input-field" placeholder="Harga Jual">
                <div class="flex gap-2">
                    <button class="btn-success" onclick="saveBarang()">Simpan</button>
                    <button class="btn-danger" onclick="document.getElementById('barang-form').innerHTML=''">Batal</button>
                </div>
            </div>`;
        }

        async function saveBarang() {
            const name = document.getElementById('bf-name').value;
            const price = document.getElementById('bf-harga').value;
            const barcode = document.getElementById('bf-barcode').value;
            if (!name || !price) return showToast('Isi data dengan lengkap', 'error');
            const res = await window.dataSdk.create({ type: 'barang', name, harga_jual: parseFloat(price), barcode });
            if (res.isOk) { showToast('Berhasil simpan', 'success'); document.getElementById('barang-form').innerHTML = ''; }
        }

        function renderTransaksi(c) {
            c.innerHTML = `
            <div class="card-glass p-4 space-y-4">
                <button class="btn-primary w-full py-4 text-lg" onclick="openScanner(scanTrx)">📷 SCAN BARANG</button>
                <div id="cart-list" class="space-y-2"></div>
                <div class="border-t border-slate-700 pt-4 flex justify-between font-bold text-xl">
                    <span>Total:</span><span id="trx-total">Rp 0</span>
                </div>
                <button class="btn-success w-full" onclick="bayar()">Selesaikan Transaksi</button>
            </div>`;
        }

        function scanTrx(bc) {
            const item = allData.find(d => d.type === 'barang' && d.barcode === bc);
            if (item) {
                cartItems.push(item);
                updateCartUI();
                showToast('Ditambahkan: ' + item.name, 'success');
            } else showToast('Barang tidak ditemukan', 'warn');
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list');
            const total = document.getElementById('trx-total');
            const sum = cartItems.reduce((a, b) => a + b.harga_jual, 0);
            list.innerHTML = cartItems.map((c, i) => `<div class="flex justify-between p-2 bg-slate-800 rounded"><span>${c.name}</span><span>${fmtRp(c.harga_jual)}</span></div>`).join('');
            total.textContent = fmtRp(sum);
        }

        async function bayar() {
            if (cartItems.length === 0) return showToast('Keranjang kosong', 'warn');
            const sum = cartItems.reduce((a, b) => a + b.harga_jual, 0);
            const res = await window.dataSdk.create({ type: 'transaksi', grand_total: sum, items_json: JSON.stringify(cartItems), tgl: new Date().toISOString() });
            if (res.isOk) { showToast('Transaksi Berhasil!', 'success'); cartItems = []; updateCartUI(); }
        }

        async function deleteData(bid) {
            const item = allData.find(d => d.__backendId === bid);
            await window.dataSdk.delete(item);
            showToast('Dihapus', 'info');
        }

        // --- INIT ---
        const dataHandler = { onDataChanged(data) { allData = data; renderPage(); } };
        async function initApp() {
            await window.dataSdk.init(dataHandler);
            window.elementSdk.init({ defaultConfig });
            navigateTo('dashboard');
            setInterval(() => {
                const el = document.getElementById('clock');
                if (el) el.textContent = new Date().toLocaleTimeString('id-ID');
            }, 1000);
        }
        initApp();
    </script>
</body>
</html>
