<!doctype html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPOS v3.3 - Dynamic Master Data</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f1f5f9; overflow: hidden; }
        .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; }
        .input-field { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; width: 100%; }
        .sidebar-item { transition: 0.3s; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #94a3b8; }
        .sidebar-item.active { background: #6366f1; color: white; }
        .btn-icon { padding: 8px; border-radius: 8px; transition: 0.2s; }
        .btn-edit { color: #fbbf24; background: rgba(251, 191, 36, 0.1); }
        .btn-delete { color: #f87171; background: rgba(248, 113, 113, 0.1); }
        .btn-edit:hover { background: #fbbf24; color: black; }
        .btn-delete:hover { background: #f87171; color: white; }
    </style>
</head>
<body class="h-full flex">

    <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-8">
        <div class="flex items-center gap-3 px-2">
            <div class="bg-indigo-500 p-2 rounded-lg"><i data-lucide="zap" class="text-white"></i></div>
            <h1 class="font-extrabold text-xl tracking-tighter">PRO<span class="text-indigo-500">POS</span></h1>
        </div>
        <nav class="flex flex-col gap-2">
            <div onclick="switchMenu('dashboard')" id="nav-dashboard" class="sidebar-item active"><i data-lucide="layout-dashboard"></i> Dashboard</div>
            <div onclick="switchMenu('transaksi')" id="nav-transaksi" class="sidebar-item"><i data-lucide="shopping-cart"></i> Transaksi</div>
            <div onclick="switchMenu('referensi')" id="nav-referensi" class="sidebar-item"><i data-lucide="book-open"></i> Referensi</div>
            <div onclick="switchMenu('setting')" id="nav-setting" class="sidebar-item"><i data-lucide="settings"></i> Setting</div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-950/50">
            <h2 id="menu-title" class="text-xl font-bold uppercase tracking-widest text-indigo-400">Dashboard</h2>
            <div id="clock" class="text-sm font-mono text-slate-500"></div>
        </header>
        <div id="main-view" class="flex-1 overflow-y-auto p-8"></div>
    </main>

    <div id="scanner-ui" class="hidden fixed inset-0 bg-black/90 z-[9999] flex flex-col items-center justify-center">
        <div class="w-64 h-64 border-4 border-indigo-500 rounded-3xl overflow-hidden relative">
            <video id="scan-v" class="w-full h-full object-cover"></video>
        </div>
        <button onclick="stopScan()" class="mt-8 bg-white text-black px-10 py-3 rounded-full font-bold">BATAL</button>
    </div>

    <script>
        // --- DATA STATE ---
        let db_items = JSON.parse(localStorage.getItem('v33_items')) || [];
        let config = JSON.parse(localStorage.getItem('v33_cfg')) || { name: "Toko Saya", qris_id: "08123" };
        let currentEditIdx = null;

        const fmtRp = (n) => "Rp " + new Intl.NumberFormat('id-ID').format(n);

        function switchMenu(m) {
            document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
            document.getElementById('nav-'+m).classList.add('active');
            document.getElementById('menu-title').innerText = m;
            const v = document.getElementById('main-view');

            if(m === 'referensi') renderReferensi(v);
            if(m === 'transaksi') v.innerHTML = `<div class="card-glass p-10 text-center">Menu Transaksi Ready.</div>`;
            if(m === 'dashboard') v.innerHTML = `<div class="card-glass p-20 text-center"><h2 class="text-3xl font-bold">Selamat Datang di ${config.name}</h2></div>`;
            lucide.createIcons();
        }

        // --- MENU REFERENSI (LOGIKA UTAMA) ---
        function renderReferensi(v) {
            v.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="card-glass p-6 h-fit sticky top-0">
                        <h3 id="form-title" class="font-bold mb-6 text-indigo-400">Tambah Produk Baru</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs text-slate-500 mb-1 block">BARCODE</label>
                                <div class="flex gap-2">
                                    <input id="ref-barcode" class="input-field" placeholder="Scan atau Ketik...">
                                    <button onclick="startScan('ref-barcode')" class="bg-indigo-600 p-3 rounded-lg"><i data-lucide="camera" class="w-5 h-5"></i></button>
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 mb-1 block">NAMA PRODUK</label>
                                <input id="ref-nama" class="input-field" placeholder="Contoh: Kopi Susu Gula Aren">
                            </div>
                            <div>
                                <label class="text-xs text-slate-500 mb-1 block">HARGA JUAL (Rp)</label>
                                <input id="ref-harga" type="number" class="input-field" placeholder="0">
                            </div>
                            <div class="flex gap-2 pt-4">
                                <button id="btn-save" onclick="saveProduct()" class="flex-1 bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold transition-all">SIMPAN DATA</button>
                                <button id="btn-cancel" onclick="resetForm()" class="hidden bg-slate-700 hover:bg-slate-600 px-4 rounded-xl transition-all"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-2 card-glass p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-bold">Daftar Produk (${db_items.length})</h3>
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-slate-500"></i>
                                <input oninput="loadTable(this.value)" class="input-field pl-10 py-2 w-64" placeholder="Cari nama/barcode...">
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-separate border-spacing-y-2">
                                <thead class="text-slate-500 text-xs uppercase">
                                    <tr>
                                        <th class="pb-4 pl-4">Produk</th>
                                        <th class="pb-4">Harga</th>
                                        <th class="pb-4 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            loadTable();
        }

        function loadTable(filter = "") {
            const tbody = document.getElementById('table-body');
            const filtered = db_items.filter(i => 
                i.nama.toLowerCase().includes(filter.toLowerCase()) || 
                i.barcode.includes(filter)
            );

            tbody.innerHTML = filtered.map((item, idx) => `
                <tr class="bg-slate-800/30 hover:bg-slate-800/60 transition-all group">
                    <td class="p-4 rounded-l-xl">
                        <div class="font-bold text-white">${item.nama}</div>
                        <div class="text-[10px] font-mono text-slate-500 tracking-wider">${item.barcode}</div>
                    </td>
                    <td class="p-4 font-bold text-indigo-400">${fmtRp(item.jual)}</td>
                    <td class="p-4 rounded-r-xl text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="editProduct(${idx})" class="btn-icon btn-edit" title="Edit"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                            <button onclick="deleteProduct(${idx})" class="btn-icon btn-delete" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
            if(filtered.length === 0) tbody.innerHTML = `<tr><td colspan="3" class="text-center p-10 text-slate-500">Data tidak ditemukan</td></tr>`;
            lucide.createIcons();
        }

        function saveProduct() {
            const barcode = document.getElementById('ref-barcode').value.trim();
            const nama = document.getElementById('ref-nama').value.trim();
            const jual = parseInt(document.getElementById('ref-harga').value);

            if(!barcode || !nama || isNaN(jual)) return alert("Mohon lengkapi semua kolom!");

            if(currentEditIdx !== null) {
                // Proses Update
                db_items[currentEditIdx] = { ...db_items[currentEditIdx], barcode, nama, jual };
                alert("Produk berhasil diperbarui!");
            } else {
                // Cek duplikat barcode
                if(db_items.find(i => i.barcode === barcode)) return alert("Barcode sudah terdaftar!");
                // Proses Simpan Baru
                db_items.push({ barcode, nama, jual, terjual: 0 });
                alert("Produk berhasil disimpan!");
            }

            localStorage.setItem('v33_items', JSON.stringify(db_items));
            resetForm();
            loadTable();
        }

        function editProduct(idx) {
            currentEditIdx = idx;
            const item = db_items[idx];
            
            document.getElementById('form-title').innerText = "Edit Produk";
            document.getElementById('ref-barcode').value = item.barcode;
            document.getElementById('ref-nama').value = item.nama;
            document.getElementById('ref-harga').value = item.jual;
            
            document.getElementById('btn-save').innerText = "UPDATE DATA";
            document.getElementById('btn-cancel').classList.remove('hidden');
            document.getElementById('form-title').scrollIntoView({ behavior: 'smooth' });
        }

        function deleteProduct(idx) {
            if(confirm(`Hapus produk "${db_items[idx].nama}"?`)) {
                db_items.splice(idx, 1);
                localStorage.setItem('v33_items', JSON.stringify(db_items));
                loadTable();
            }
        }

        function resetForm() {
            currentEditIdx = null;
            document.getElementById('form-title').innerText = "Tambah Produk Baru";
            document.getElementById('ref-barcode').value = "";
            document.getElementById('ref-nama').value = "";
            document.getElementById('ref-harga').value = "";
            document.getElementById('btn-save').innerText = "SIMPAN DATA";
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        // --- SCANNER UTILS ---
        let scannerReader = null;
        function startScan(tid) {
            document.getElementById('scanner-ui').classList.remove('hidden');
            if(!scannerReader) scannerReader = new ZXing.BrowserMultiFormatReader();
            scannerReader.decodeFromVideoDevice(null, 'scan-v', (res) => {
                if(res) { 
                    document.getElementById(tid).value = res.text; 
                    stopScan(); 
                    // Jika di menu edit, bantu trigger cari nama otomatis jika diinginkan
                }
            });
        }
        function stopScan() { if(scannerReader) scannerReader.reset(); document.getElementById('scanner-ui').classList.add('hidden'); }

        window.onload = () => {
            switchMenu('referensi');
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString('id-ID'); }, 1000);
        };
    </script>
</body>
</html>
