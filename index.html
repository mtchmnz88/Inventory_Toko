// Fungsi untuk memunculkan Scanner
function startScanBc(targetInputId) {
    // Buat area kamera muncul di layar (Overlay)
    const scanModal = document.createElement('div');
    scanModal.id = 'scanner-overlay';
    scanModal.className = 'fixed inset-0 bg-black/90 z-[999] flex flex-col items-center justify-center p-6';
    scanModal.innerHTML = `
        <div class="w-full max-w-md bg-slate-900 rounded-3xl overflow-hidden border border-slate-700 shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-xs font-black uppercase text-indigo-400">Scan Barcode Produk</h3>
                <button onclick="stopScan()" class="text-slate-500 hover:text-white"><i data-lucide="x"></i></button>
            </div>
            <div id="reader" class="w-full bg-black"></div>
            <div class="p-6 text-center">
                <p class="text-[10px] text-slate-500 uppercase tracking-widest">Arahkan kamera ke barcode barang</p>
            </div>
        </div>
    `;
    document.body.appendChild(scanModal);
    lucide.createIcons();

    const html5QrCode = new Html5Qrcode("reader");
    window.scannerObj = html5QrCode; // Simpan ke global agar bisa dimatikan

    const config = { fps: 10, qrbox: { width: 250, height: 150 } };

    html5QrCode.start(
        { facingMode: "environment" }, // Pakai kamera belakang
        config,
        (decodedText) => {
            // Jika berhasil scan
            document.getElementById(targetInputId).value = decodedText;
            stopScan(); // Matikan kamera
            alert("Barcode Terdeteksi: " + decodedText);
        },
        (errorMessage) => { /* ignore error nyari barcode */ }
    ).catch(err => {
        alert("Gagal akses kamera: " + err);
        stopScan();
    });
}

function stopScan() {
    if (window.scannerObj) {
        window.scannerObj.stop().then(() => {
            const overlay = document.getElementById('scanner-overlay');
            if (overlay) overlay.remove();
        });
    } else {
        const overlay = document.getElementById('scanner-overlay');
        if (overlay) overlay.remove();
    }
}

function editRef(i) {
    const item = db_ref[i];
    document.getElementById('edit-index').value = i;
    document.getElementById('ref-nama').value = item.nama;
    document.getElementById('ref-bc').value = item.bc;
    document.getElementById('ref-beli').value = item.beli;
    document.getElementById('ref-jual').value = item.jual;
    document.getElementById('form-title').innerText = "Edit Produk";
}

function hapusRef(i) {
    if(confirm("Hapus barang ini?")) {
        db_ref.splice(i, 1);
        localStorage.setItem('db_ref', JSON.stringify(db_ref));
        loadTableRef();
    }
}

function batalEdit() {
    document.getElementById('edit-index').value = "-1";
    document.getElementById('ref-nama').value = "";
    document.getElementById('ref-bc').value = "";
    document.getElementById('ref-beli').value = "";
    document.getElementById('ref-jual').value = "";
    document.getElementById('form-title').innerText = "Tambah / Edit Produk";
}

function filterRef(val) {
    const hasil = db_ref.filter(p => p.nama.toLowerCase().includes(val.toLowerCase()));
    loadTableRef(hasil);
}

// 6. FUNGSI PENDUKUNG (Logo, Filter, Jam, Chart)
function handleLogoUpload(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('logo-toko-img').src = e.target.result;
            db_cfg.logo = e.target.result;
            localStorage.setItem('db_cfg', JSON.stringify(db_cfg));
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function updateDashboardByFilter() {
    const vProfit = document.getElementById('v-profit');
    if(vProfit) vProfit.innerText = "Rp 0";
    // Logika hitung profit akan aktif jika sudah ada data transaksi
}

const fmtRp = (n) => "Rp " + new Intl.NumberFormat('id-ID').format(n);

setInterval(() => { 
    const jam = document.getElementById('jam');
    if(jam) jam.innerText = new Date().toLocaleString(); 
}, 1000);

window.onload = () => {
    if(db_cfg.logo) document.getElementById('logo-toko-img').src = db_cfg.logo;
    document.getElementById('nama-toko-side').innerText = db_cfg.name;
    gantiMenu('dashboard');
};
                            
    </script>
