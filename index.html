<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPOS FIX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; height: 100vh; }
        
        /* Sidebar */
        aside { width: 250px; background: #1e293b; padding: 20px; border-right: 1px solid #334155; }
        .menu-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; color: #94a3b8; }
        .menu-item:hover { background: #334155; color: white; }
        .menu-item.active { background: #6366f1; color: white; }

        /* Main */
        main { flex: 1; display: flex; flex-col: column; overflow: hidden; }
        header { height: 60px; background: #1e293b; display: flex; align-items: center; padding: 0 30px; border-bottom: 1px solid #334155; justify-content: space-between; }
        #konten-utama { flex: 1; padding: 30px; overflow-y: auto; }

        /* Style Tabel & Form */
        .stat-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 5px; width: 100%; margin-bottom: 10px; outline: none; }
        input:focus { border-color: #6366f1; }
        button { background: #6366f1; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #4f46e5; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #94a3b8; text-transform: uppercase; font-size: 12px; }
        .btn-hapus { background: #be123c; padding: 5px 10px; font-size: 11px; width: auto; }
    </style>
</head>
<body>

    <aside>
        <h2 style="color: #6366f1; margin-bottom: 30px;">Pro<span style="color:white">POS</span></h2>
        <div onclick="gantiMenu('dashboard')" id="m-dashboard" class="menu-item active">Dashboard</div>
        <div onclick="gantiMenu('referensi')" id="m-referensi" class="menu-item">Referensi Produk</div>
        <div onclick="alert('Menu dalam pengembangan')" class="menu-item">Kelola Stok</div>
        <div onclick="alert('Menu dalam pengembangan')" class="menu-item">Transaksi</div>
    </aside>

    <main>
        <header>
            <h3 id="judul-halaman">DASHBOARD</h3>
            <div id="jam" style="font-size: 12px; color: #94a3b8;"></div>
        </header>
        <div id="konten-utama"></div>
    </main>

    <script>
        // Data Global
        let db_ref = JSON.parse(localStorage.getItem('db_ref_pos')) || [];

        // Fungsi Ganti Halaman
        function gantiMenu(menu) {
            // Update UI Menu
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById('m-' + menu).classList.add('active');
            document.getElementById('judul-halaman').innerText = menu.toUpperCase();

            const target = document.getElementById('konten-utama');
            if (menu === 'dashboard') renderDashboard(target);
            if (menu === 'referensi') renderReferensi(target);
        }

        // Render Dashboard
        function renderDashboard(target) {
            target.innerHTML = `
                <div class="stat-card">
                    <h3>Selamat Datang di ProPOS</h3>
                    <p style="color: #94a3b8; margin-top: 10px;">Total Produk Terdaftar: <b>${db_ref.length} Barang</b></p>
                </div>
            `;
        }

        // Render Referensi
        function renderReferensi(target) {
            target.innerHTML = `
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div class="stat-card" style="flex: 1; min-width: 300px;">
                        <h3>Tambah Produk</h3>
                        <div style="margin-top: 15px;">
                            <input type="text" id="nama" placeholder="Nama Barang (Wajib)">
                            <input type="text" id="barcode" placeholder="Barcode (Opsional)">
                            <input type="number" id="beli" placeholder="Harga Beli">
                            <input type="number" id="jual" placeholder="Harga Jual (Wajib)">
                            <button onclick="simpanBarang()">SIMPAN BARANG</button>
                        </div>
                    </div>
                    <div class="stat-card" style="flex: 2; min-width: 400px;">
                        <h3>Daftar Barang</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Produk</th>
                                    <th>Beli</th>
                                    <th>Jual</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-barang"></tbody>
                        </table>
                    </div>
                </div>
            `;
            tampilkanTabel();
        }

        // Logika Simpan Data
        function simpanBarang() {
            const nama = document.getElementById('nama').value;
            const bc = document.getElementById('barcode').value;
            const beli = document.getElementById('beli').value || 0;
            const jual = document.getElementById('jual').value;

            if (!nama || !jual) {
                alert("Nama dan Harga Jual tidak boleh kosong!");
                return;
            }

            db_ref.push({ nama, bc, beli, jual });
            localStorage.setItem('db_ref_pos', JSON.stringify(db_ref));
            
            alert("Barang berhasil disimpan!");
            renderReferensi(document.getElementById('konten-utama')); // Refresh halaman
        }

        // Tampilkan Tabel
        function tampilkanTabel() {
            const tbody = document.getElementById('tabel-barang');
            if (!tbody) return;
            
            if (db_ref.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#555">Belum ada data</td></tr>';
                return;
            }

            tbody.innerHTML = db_ref.map((item, index) => `
                <tr>
                    <td><b>${item.nama}</b><br><small style="color:#666">${item.bc || '-'}</small></td>
                    <td>Rp ${item.beli}</td>
                    <td>Rp ${item.jual}</td>
                    <td><button class="btn-hapus" onclick="hapusBarang(${index})">Hapus</button></td>
                </tr>
            `).join('');
        }

        function hapusBarang(index) {
            if (confirm("Hapus barang ini?")) {
                db_ref.splice(index, 1);
                localStorage.setItem('db_ref_pos', JSON.stringify(db_ref));
                renderReferensi(document.getElementById('konten-utama'));
            }
        }

        // Jam & Start
        setInterval(() => {
            const jamEl = document.getElementById('jam');
            if(jamEl) jamEl.innerText = new Date().toLocaleString('id-ID');
        }, 1000);

        window.onload = () => gantiMenu('dashboard');
    </script>
</body>
</html>
