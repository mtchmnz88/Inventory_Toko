<!doctype html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory POS Manager</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .card-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; }
        .nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 8px; transition: 0.3s; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); }
        .active-nav { background: #6366f1; color: white; }
    </style>
</head>
<body class="h-full">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 hidden md:block">
            <h1 class="text-xl font-bold mb-8 text-indigo-400">POS Inventory</h1>
            <nav class="space-y-2">
                <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn active-nav">Dashboard</button>
                <button onclick="navigate('barang')" id="nav-barang" class="nav-btn">Kelola Barang</button>
                <button onclick="navigate('transaksi')" id="nav-transaksi" class="nav-btn">Transaksi</button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 border-b border-slate-800 flex items-center px-6 bg-slate-900/50">
                <h2 id="page-title" class="font-semibold text-lg">Dashboard</h2>
            </header>
            <div id="content" class="p-6 overflow-y-auto">
                </div>
        </main>
    </div>

    <script>
        function navigate(page) {
            const content = document.getElementById('content');
            const title = document.getElementById('page-title');
            
            // Reset active class
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active-nav'));
            document.getElementById('nav-' + page).classList.add('active-nav');
            
            title.innerText = page.charAt(0).toUpperCase() + page.slice(1);

            if(page === 'dashboard') {
                content.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="card-glass p-6">
                            <p class="text-slate-400 text-sm">Total Barang</p>
                            <h3 class="text-2xl font-bold">128</h3>
                        </div>
                        <div class="card-glass p-6">
                            <p class="text-slate-400 text-sm">Transaksi Hari Ini</p>
                            <h3 class="text-2xl font-bold">15</h3>
                        </div>
                    </div>
                `;
            } else if(page === 'barang') {
                content.innerHTML = `
                    <div class="card-glass p-6">
                        <button class="bg-indigo-600 px-4 py-2 rounded-lg mb-4 text-sm font-bold"> + Tambah Barang</button>
                        <p class="text-slate-400 italic">Daftar barang akan muncul di sini.</p>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="card-glass p-6 text-center">Fitur Transaksi & Scanner Siap Digunakan.</div>`;
            }
        }

        // Jalankan dashboard pertama kali
        window.onload = () => navigate('dashboard');
    </script>
</body>
</html>
